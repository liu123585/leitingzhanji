function glowSprite(col,r){if(r<1)r=1;var key=col+'|'+Math.round(r);var s=_glowCache[key];if(s)return s;var c=document.createElement('canvas');c.width=c.height=Math.ceil(r*2);var g=c.getContext('2d');var rgb=_glowRGB(col),cx=r;var rg=g.createRadialGradient(cx,cx,0,cx,cx,cx);rg.addColorStop(0,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.85)');rg.addColorStop(0.45,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.35)');rg.addColorStop(1,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');g.fillStyle=rg;g.beginPath();g.arc(cx,cx,cx,0,6.28);g.fill();_glowCache[key]=c;return c;}

// 立即生成大 Boss（预警期间玩家点击/触摸时调用，或倒计时归零时自动调用）
function spawnBoss(){if(bossWarningTimer<=0&&state!='playing')return;bossWarningTimer=0;var lv=getLv();var count=currentLevel>=30?4:currentLevel>=20?3:currentLevel>=10?2:1;for(var i=0;i<count;i++){var bb=BIGBOSSES[((currentLevel-1)+i)%BIGBOSSES.length];var bossHP=Math.round(lv.bossHp*bb.hpMul);var e={x:240+(i-(count-1)/2)*60,y:-60-i*30,vx:0,vy:1.2,hp:bossHP,maxHp:bossHP,type:'boss',isBig:true,name:bb.name,color:bb.color,cl2:bb.cl2,skin:bb.skin,w:80,h:60,t:0,fireTimer:i*10,phase:1,abilities:bb};if(bb.shield)e.shieldHP=bossHP*0.3;if(bb.revive)e.revive=true;if(bb.burnBullets)e.burnBullets=true;ens.push(e);}wShield=1+tl('shield');if(gameMode=='dual')p2wShield=1+tl('shield');play('shield');var fn=BIGBOSSES[(currentLevel-1)%BIGBOSSES.length].name;if(count>=3)speakText('大 boss 集群降临！',0.9,1.3);else if(count==2)speakText('两名大 boss 降临！',0.9,1.3);else speakBossArrival(fn,true);}
// BOSS挑战：直接生成一个Boss（跳过小兵）
function spawnBossRushBoss(){
  if(state!='playing')return;
  var lv=getLv();
  var idx=bossRushRound%BIGBOSSES.length;
  var bb=BIGBOSSES[idx];
  // Boss血量：基于闯关血量降为1/4（因无小兵捡道具），每轮+12%
  var hpScale=0.25+bossRushRound*0.12;
  var bossHP=Math.max(500,Math.round(lv.bossHp*bb.hpMul*hpScale));
  var e={x:240,y:-60,vx:0,vy:1.0,hp:bossHP,maxHp:bossHP,type:'boss',isBig:true,name:bb.name,color:bb.color,cl2:bb.cl2,skin:bb.skin,w:80,h:60,t:0,fireTimer:0,phase:1,abilities:bb};
  if(bb.shield)e.shieldHP=bossHP*0.3;if(bb.revive)e.revive=true;if(bb.burnBullets)e.burnBullets=true;  ens.push(e);
  for(var _ri=0;_ri<26;_ri++){var _ra=_ri/26*6.283;pts.push({x:240,y:140,vx:Math.cos(_ra)*6,vy:Math.sin(_ra)*6,life:32,cl:'#ff8c00',sz:3+Math.random()*3});}

  wPower=Math.max(wPower,5);wLevel=Math.max(wLevel,2);wMissile=Math.max(wMissile,2);

// 护盾破损（裂纹破碎）动画状态：受击吸收伤害时触发，绘制放射状裂痕+爆闪环
var SHIELD_BREAK_DUR=30;
var p1BreakT=0,p2BreakT=0,p1BreakLines=null,p2BreakLines=null;
function triggerShieldBreak(isP2){
  var n=6+Math.floor(Math.random()*3), lines=[];
  for(var i=0;i<n;i++){
    var a=(i/n)*Math.PI*2+Math.random()*0.5, segs=[{x:0,y:0}];
    var len=34+Math.random()*40, step=7+Math.random()*4, d=0, x=0, y=0;
    while(d<len){x+=Math.cos(a)*step+(Math.random()-0.5)*9;y+=Math.sin(a)*step+(Math.random()-0.5)*9;segs.push({x:x,y:y});d+=step;}
    lines.push(segs);
  }
  if(isP2){p2BreakT=SHIELD_BREAK_DUR;p2BreakLines=lines;}else{p1BreakT=SHIELD_BREAK_DUR;p1BreakLines=lines;}
}
function drawShieldBreakFx(isP2){
  var T=isP2?p2BreakT:p1BreakT, L=isP2?p2BreakLines:p1BreakLines;
  if(T<=0||!L)return;
  var k=T/SHIELD_BREAK_DUR;
  ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,k));
  var r0=(1-k)*64+8;
  ctx.lineWidth=2.5*k+0.5;ctx.strokeStyle='rgba(210,245,255,'+(0.85*k)+')';
  ctx.shadowColor='#bfefff';ctx.shadowBlur=16*k;
  ctx.beginPath();ctx.ellipse(0,-4,r0,r0*1.18,0,0,6.28);ctx.stroke();
  ctx.shadowBlur=0;ctx.lineWidth=1.8*k+0.4;ctx.strokeStyle='rgba(240,250,255,'+(0.9*k)+')';
  for(var i=0;i<L.length;i++){var s=L[i];ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(var j=1;j<s.length;j++)ctx.lineTo(s[j].x,s[j].y);ctx.stroke();}
  ctx.restore();
}

  var pref=/xiao|xiaoyi|yaoyao|ting|tingting|huihui|yaoyao|mei|female|女|琳|娜|婷|雪|婉|雅|欣/i;
  var best=null;
  for(var i=0;i<pool.length;i++){if(pref.test(pool[i].name)){best=pool[i];break;}}

}

    o2.connect(g2);g2.connect(c.destination);o2.start(now);o2.stop(now+spb);bgmNodes.push(o2);
    // 和弦铺底（每2步一次）
    if(idx%2==0){var o3=c.createOscillator(),g3=c.createGain();o3.type='sine';o3.frequency.value=tr.chord[idx];

      o3.connect(g3);g3.connect(c.destination);o3.start(now);o3.stop(now+spb*2);bgmNodes.push(o3);}
    idx=(idx+1)%step;

}

function startWave(){
  wave++;var lv=getLv();
  if(wave==lv.waveCount){waveMax=1;waveEnemies=0;bossWarningTimer=120;play('bossWarning');}
  else if(wave%5==0){ // 每5波小Boss（后续关卡多只 + 混入大Boss）
    var miniCount=currentLevel>=25?3:currentLevel>=12?2:1;
    for(var m=0;m<miniCount;m++){
      var useBig=currentLevel>=15&&m>0&&Math.random()<0.35;
      var mb=useBig?BIGBOSSES[((currentLevel-1)+m)%BIGBOSSES.length]:MINIBOSSES[((Math.floor(wave/5)-1)+(currentLevel-1)+m)%MINIBOSSES.length];
      var mbHP=Math.round((1000+lv.hpMult*400)*mb.hpMul);
      var e={x:240+(m-(miniCount-1)/2)*70,y:-50-m*25,vx:1.2,vy:0.8,hp:mbHP,maxHp:mbHP,type:'boss',isBig:!!useBig,name:mb.name,color:mb.color,skin:mb.skin,w:useBig?80:54,h:useBig?60:44,t:0,fireTimer:m*8,phase:1,mini:!useBig,abilities:mb};
      if(mb.shield)e.shieldHP=mbHP*0.3;if(mb.revive)e.revive=true;if(mb.burnBullets)e.burnBullets=true;ens.push(e);
    }
    waveMax=0;waveEnemies=miniCount;play('bossWarning');
    if(miniCount>=3)speakText('小 boss 群来袭！',0.9,1.3);
    else if(miniCount==2)speakText('两名小 boss 出现！',0.9,1.3);
    else speakBossArrival(mb.name,false);
  }
  else{waveMax=22+wave*7+Math.floor(lv.enemyMult*9);play('waveStart');}
  if(wave!=lv.waveCount&&wave%5!=0)waveEnemies=0;
  spawnTimer=wave==1?15:35;
}

c.ontouchstart=function(e){
  e.preventDefault();
  for(var ti=0;ti<e.changedTouches.length;ti++){
    var t=e.changedTouches[ti];
    if(!t)continue;
    var r=c.getBoundingClientRect();
    var tx=(t.clientX-r.left)*480/r.width;
    var ty=(t.clientY-r.top)*720/r.height;
    touchStartY=t.clientY;touchMoved=false;
    // 非playing界面：天赋页拖动或菜单点击
    if(state!=='playing'){
      if(state=='talent'){touchStartY=t.clientY;}
      continue;
    }
    // 先检查游戏按钮
    if(handleGameButton(tx,ty)){buttonTouchId=t.identifier;continue;}
    // 直接触控移动玩家
    if(gameMode!='dual'&&bossWarningTimer<=0){px=Math.round(tx);py=Math.round(ty);}
  }
};
c.ontouchmove=function(e){
  e.preventDefault();

    var r=c.getBoundingClientRect();

    // 直接触控移动玩家
    if(t.identifier!==buttonTouchId){
      px=Math.round(tx);py=Math.round(ty);
    }
  }
};
c.ontouchend=function(e){
  e.preventDefault();
  for(var ti=0;ti<e.changedTouches.length;ti++){
    var t=e.changedTouches[ti];
    if(!t)continue;
    var r=c.getBoundingClientRect();
    var tx=(t.clientX-r.left)*480/r.width;
    var ty=(t.clientY-r.top)*720/r.height;
    // 已被ontouchstart拦截的按钮触摸，松手时不再重复触发
    if(t.identifier===buttonTouchId){buttonTouchId=-1;continue;}
    // 非摇杆触摸结束：若未滑动，当点击处理
    if(!touchMoved){

      if(state=='playing'){if(handleGameButton(tx,ty))continue;}
      handleClick(tx,ty);
    }
  }
};

  var startY=120,rh=72;

function buyTalent(id){
  var t=findTalent(id);if(!t)return;var cur=tl(id);
  if(cur>=t.max)return;if(talentPoints<t.cost)return;
  talentPoints-=t.cost;talentLv[id]=cur+1;saveTalents();play('menuClick');
  // 购买必杀后立即生效（不需要重新开始关卡）
  if(id=='nova'){novaUnlocked=true;skillCds=new Array(ULT_SKILLS.length).fill(0);selectedUlt=0;}
  // novaCd discount applied in useUlt() via tl('novaCd')
  if(id=='novaDmg'){novaDmgMul=1+tl('novaDmg')*0.25;}
  // 新必杀技解锁后自动选中
  for(var ui=0;ui<ULT_SKILLS.length;ui++){var us=ULT_SKILLS[ui];if(tl(us.talentId)>0)selectedUlt=ui;}
}

function drawPlayerShip(x,y,isP2,flash){

// ===== 护盾光罩绘制（局部坐标，须在战机 translate 后、restore 前调用）=====
function drawShieldAura(sh,isP2){
  if(!sh||sh<=0)return;               // 只按传入的护盾层数绘制
  var _inv=isP2?p2Invuln:playerInvuln;
  var _pulse=0.5+0.5*Math.sin(frameCount*0.12);            // 呼吸脉动
  var _hit=(_inv>0)?Math.min(1,_inv/30):0;                 // 受击/刚挡下时更亮
  var _rx=42+sh*3,_ry=54+sh*3;                             // 层数越多罩越大
  ctx.save();
  // 柔光填充（中心透明→边缘蓝色）
  var _g=ctx.createRadialGradient(0,-4,8,0,-4,Math.max(_rx,_ry));
  _g.addColorStop(0,'rgba(120,220,255,0)');
  _g.addColorStop(0.7,'rgba(80,200,255,'+(0.10+0.06*sh)+')');
  _g.addColorStop(1,'rgba(60,180,255,'+(0.20+0.08*sh)+')');
  ctx.fillStyle=_g;ctx.beginPath();ctx.ellipse(0,-4,_rx,_ry,0,0,6.28);ctx.fill();
  // 主光环（发光描边，受击时爆亮）
  ctx.lineWidth=2.5;ctx.strokeStyle='rgba(160,235,255,'+(0.55+0.25*_pulse+0.4*_hit)+')';
  ctx.shadowColor='#7fe9ff';ctx.shadowBlur=14+10*_pulse+20*_hit;
  ctx.beginPath();ctx.ellipse(0,-4,_rx,_ry,0,0,6.28);ctx.stroke();
  // 外层第二圈光环（正版同心圆层次感）
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(120,220,255,'+(0.30+0.20*_pulse+0.3*_hit)+')';
  ctx.shadowBlur=10+8*_pulse+16*_hit;
  ctx.beginPath();ctx.ellipse(0,-4,_rx+7,_ry+7,0,0,6.28);ctx.stroke();
  // 外层第三圈细环
  ctx.lineWidth=1;ctx.strokeStyle='rgba(90,200,255,'+(0.18+0.15*_pulse+0.2*_hit)+')';
  ctx.shadowBlur=6+6*_pulse;
  ctx.beginPath();ctx.ellipse(0,-4,_rx+14,_ry+14,0,0,6.28);ctx.stroke();
  // 内层细环（层次感）
  ctx.shadowBlur=0;ctx.lineWidth=1;ctx.strokeStyle='rgba(200,245,255,'+(0.25+0.2*_pulse)+')';
  ctx.beginPath();ctx.ellipse(0,-4,_rx-6,_ry-6,0,0,6.28);ctx.stroke();
  // 顶部高光弧（玻璃质感）
  ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,'+(0.4+0.4*_hit)+')';
  ctx.beginPath();ctx.ellipse(0,-4,_rx,_ry,-0.5,Math.PI*1.05,Math.PI*1.5);ctx.stroke();
  ctx.restore();
}
// 战机两侧炮台绘制：明显放大、发光、带脉冲蓄能环，确保清晰可见
function drawTurrets(){
  var t=frameCount*0.15;
  for(var s=-1;s<=1;s+=2){
    var tx=s*TURRET_DX, ty=TURRET_DY+6;
    // 外层脉冲光环（蓄能感）
    var pulse=0.55+0.45*Math.sin(t);
    ctx.fillStyle='rgba(0,229,255,'+(0.18*pulse)+')';
    ctx.beginPath();ctx.arc(tx,ty,16,0,6.28);ctx.fill();
    // 炮座（大圆 + 发光描边）
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=14;
    ctx.fillStyle='#1b2a44';ctx.beginPath();ctx.arc(tx,ty,11,0,6.28);ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle='#00e5ff';ctx.stroke();
    ctx.shadowBlur=0;
    // 炮管（两边都朝上、朝外：左炮台斜左上，右炮台斜右上）
    ctx.save();ctx.translate(tx,ty);ctx.rotate(s*Math.PI/4);
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=10;
    ctx.fillStyle='#7fe9ff';ctx.fillRect(-5,-22,10,22);
    ctx.fillStyle='#cffaff';ctx.fillRect(-2,-22,4,22); // 高光
    ctx.shadowBlur=0;
    ctx.restore();
    // 炮口蓄能光点（亮青，脉冲，位于斜外上炮口）
    ctx.fillStyle='rgba(180,250,255,'+(0.6+0.4*Math.sin(t))+')';
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(tx+s*15,ty-15,4,0,6.28);ctx.fill();
    ctx.shadowBlur=0;
  }
}

// === MAIN DRAW ===
function draw(){
  ctx.save();
  drawBackground();
  // 开场倒计时（黑屏 + 金色数字 3/2/1 + 雷霆战机图标）
  if(state=='countdown'){
    ctx.fillStyle='#000';ctx.fillRect(0,0,480,720);
    ctx.textAlign='center';
    // tick=4→3, 3→2, 2→1, 1→图标
    var tick=Math.ceil(countdownTimer/60);
    if(tick>=2){
      var num=tick-1;
      ctx.shadowColor='#ff0';ctx.shadowBlur=45;
      ctx.fillStyle='#ffd700';ctx.font='bold 140px Arial';
      ctx.fillText(num,240,380);
      ctx.shadowBlur=0;ctx.fillStyle='#aa8800';ctx.font='18px Arial';
      ctx.fillText('准备战斗！',240,500);
    }else{
      // 图标阶段（约1秒）
      ctx.shadowColor='#ff0';ctx.shadowBlur=55;
      ctx.fillStyle='#ffd700';ctx.font='bold 54px Arial';
      ctx.fillText('\u26A1 雷霆战机 \u26A1',240,340);
      ctx.shadowBlur=0;
      ctx.fillStyle='#aaa';ctx.font='20px Arial';
      ctx.fillText(getLv().name,240,430);
    }
    ctx.shadowBlur=0;
    ctx.restore();return;
  }
  if(state=='menu'){drawMenu();ctx.restore();return;}
  if(state=='levelSelect'){drawLevelSelect();ctx.restore();return;}
  if(state=='help'){drawHelp();ctx.restore();return;}
  if(state=='stats'){drawStats();ctx.restore();return;}
  if(state=='talent'){drawTalent();ctx.restore();return;}
  if(state=='settings'){drawSettings();ctx.restore();return;}
  if(state=='diy'){drawDIY();ctx.restore();return;}
  // Gameplay（敌弹，赛博朋克多样样式）
  for(var i=0;i<bls.length;i++){var b=bls[i];if(!b.pl)continue;
    var col=b.cl||'#0ff';
    if(b.laser){ // 追尾激光束：发光光束（预渲染光晕替代阴影，性能更好）
      var ex=b.x+(b.vx||0)*b.len/8, ey=b.y+(b.vy||0)*b.len/8;
      ctx.save();ctx.globalAlpha=0.95;ctx.lineCap='round';
      ctx.drawImage(glowSprite(col,9), b.x-9, b.y-9);
      ctx.strokeStyle=col;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(ex,ey);ctx.stroke();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(ex,ey);ctx.stroke();
      ctx.restore();continue;
    }
    // RPG 火箭弹样式：沿飞行方向绘制的拉长弹体 + 尖弹头 + 尾翼 + 尾焰（棱角分明）
    var ang=Math.atan2(b.vy||-1,b.vx||0);
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);
    var bw2=b.w, bh2=b.h; // 弹体宽、长
    ctx.drawImage(glowSprite(col, Math.max(bw2,bh2)), -Math.max(bw2,bh2), -Math.max(bw2,bh2));
    ctx.strokeStyle='#fff';ctx.lineWidth=1;
    // 尾焰（向后，尖锐三角）
    ctx.fillStyle='rgba(255,190,50,0.95)';ctx.beginPath();ctx.moveTo(-bh2/2,0-bw2*0.45);ctx.lineTo(-bh2/2-7-Math.random()*4,0);ctx.lineTo(-bh2/2,0+bw2*0.45);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,90,0,0.85)';ctx.beginPath();ctx.moveTo(-bh2/2,0-bw2*0.28);ctx.lineTo(-bh2/2-4,0);ctx.lineTo(-bh2/2,0+bw2*0.28);ctx.closePath();ctx.fill();
    // 弹体（方正长方体，棱角分明）

    // 弹体刻线（棱角高光）
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-bh2/2+3,0-bw2*0.5);ctx.lineTo(bh2/2-9,0-bw2*0.5);ctx.moveTo(-bh2/2+3,0+bw2*0.5);ctx.lineTo(bh2/2-9,0+bw2*0.5);ctx.stroke();
    // 追踪弹额外尾翼（更明显的棱角）
    if(b.homing){ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.moveTo(-bh2/2,0-bw2*0.5);ctx.lineTo(-bh2/2-5,0-bw2*0.9);ctx.lineTo(-bh2/2+4,0-bw2*0.5);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(-bh2/2,0+bw2*0.5);ctx.lineTo(-bh2/2-5,0+bw2*0.9);ctx.lineTo(-bh2/2+4,0+bw2*0.5);ctx.closePath();ctx.fill();}
    ctx.restore();
  }
  for(var i=0;i<ens.length;i++){var e=ens[i];ctx.save();ctx.translate(e.x,e.y);
    if(e.type=='boss'){
      var bc=e.color||'#f0f',bc2=e.cl2||'#faf',bc3='#ff0';

        ctx.beginPath();ctx.moveTo(0,38);ctx.lineTo(-42,-24);ctx.lineTo(-21,-12);ctx.lineTo(0,-38);ctx.lineTo(21,-12);ctx.lineTo(42,-24);ctx.closePath();ctx.fill();
      }else if((e.skin||0)==1){ // 双翼堡垒
        ctx.beginPath();ctx.moveTo(0,40);ctx.lineTo(-50,-10);ctx.lineTo(-30,-30);ctx.lineTo(0,-20);ctx.lineTo(30,-30);ctx.lineTo(50,-10);ctx.closePath();ctx.fill();

        ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(-16,-12);ctx.lineTo(16,-12);ctx.closePath();ctx.fill();
      }
      ctx.shadowBlur=0;ctx.fillStyle=bc2;
      ctx.beginPath();ctx.moveTo(0,22);ctx.lineTo(-21,-15);ctx.lineTo(0,-22);ctx.lineTo(21,-15);ctx.closePath();ctx.fill();
      ctx.fillStyle=bc3;ctx.shadowColor=bc3;ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(-12,-4,4,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(12,-4,4,0,6.28);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle='#111';ctx.fillRect(-40,-44,80,8);var r=e.hp/e.maxHp;ctx.fillStyle=r>0.3?'#f00':'#ff0';ctx.fillRect(-39,-43,78*r,6);if(r<0.1){ctx.fillStyle='#fff';ctx.fillRect(-39,-43,78*r,6);}

      ctx.beginPath();ctx.moveTo(cc.x-cc.sz,cc.y);ctx.lineTo(cc.x,cc.y-cc.sz);ctx.lineTo(cc.x+cc.sz,cc.y);ctx.lineTo(cc.x,cc.y+cc.sz);ctx.closePath();ctx.fill();}
    ctx.restore();
  }
  if(vortexTimer>0){
    ctx.save();
    var vrad=Math.min(300,30+ultVortex);
    ctx.shadowColor='#7c4dff';ctx.shadowBlur=50;
    ctx.fillStyle='rgba(120,50,200,0.15)';
    ctx.beginPath();ctx.arc(px,py,vrad,0,6.28);ctx.fill();
    for(var ri=0;ri<3;ri++){var rvr=vrad*(0.3+ri*0.3)+8*Math.sin(vortexPhase+ri*2);
      ctx.strokeStyle='rgba(180,100,255,'+(0.5-ri*0.15)+')';ctx.shadowBlur=15;ctx.lineWidth=4-ri;
      ctx.beginPath();ctx.arc(px,py,rvr,0,6.28);ctx.stroke();}
    ctx.restore();
  }
  if(slashTimer>0){
    ctx.save();
    for(var si=0;si<slashPhase;si++){var sf=Math.min(1,(60-slashTimer)/30);var len=300+sf*100;var lx=px,ly=py;
      ctx.shadowColor='#ff1744';ctx.shadowBlur=40;ctx.strokeStyle='rgba(255,23,68,'+(0.7-sf*0.3)+')';ctx.lineWidth=6+sf*12;
      ctx.beginPath();ctx.moveTo(lx-len,ly-len*1.4);ctx.lineTo(lx+len,ly+len*1.4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(lx+len,ly-len*1.4);ctx.lineTo(lx-len,ly+len*1.4);ctx.stroke();
      ctx.shadowColor='#fff';ctx.shadowBlur=20;ctx.strokeStyle='rgba(255,255,255,'+(0.5-sf*0.2)+')';ctx.lineWidth=3+sf*6;
      ctx.beginPath();ctx.moveTo(lx-len*0.8,ly-len*1.1);ctx.lineTo(lx+len*0.8,ly+len*1.1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(lx+len*0.8,ly-len*1.1);ctx.lineTo(lx-len*0.8,ly+len*1.1);ctx.stroke();}
    ctx.restore();
  }
  // 黑洞爆炸（独立于burstTimer，保证爆炸可见）
  if(ultVortexExplode>0){
    var xpf=ultVortexExplode/15;ultVortexExplode--;
    ctx.save();
    ctx.shadowColor='#7c4dff';ctx.shadowBlur=80;
    ctx.fillStyle='rgba(200,100,255,'+(xpf*0.6)+')';ctx.beginPath();ctx.arc(px,py,50+(1-xpf)*400,0,6.28);ctx.fill();
    ctx.shadowBlur=60;ctx.fillStyle='rgba(255,255,255,'+(xpf*0.3)+')';ctx.beginPath();ctx.arc(px,py,30+(1-xpf)*300,0,6.28);ctx.fill();
    ctx.restore();
  }
  if(ultCloneActive){
    for(var ci=0;ci<ultClones.length;ci++){var cl=ultClones[ci];
      ctx.save();var cla=0.5+0.15*Math.sin(frameCount*0.08+ci*3.14);
      ctx.globalAlpha=cla;ctx.shadowColor='#00e5ff';ctx.shadowBlur=25;
      ctx.fillStyle='#00e5ff';ctx.beginPath();ctx.moveTo(cl.x,cl.y-16);ctx.lineTo(cl.x-12,cl.y+12);ctx.lineTo(cl.x+12,cl.y+12);ctx.closePath();ctx.fill();
      ctx.shadowBlur=15;ctx.strokeStyle='rgba(0,229,255,0.6)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cl.x-8,cl.y+6);ctx.lineTo(cl.x-14,cl.y+14);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cl.x+8,cl.y+6);ctx.lineTo(cl.x+14,cl.y+14);ctx.stroke();
      ctx.restore();}
  }
  drawHUD();
  // 纯展示连击（仅文字 ×N + 放大回弹，无圆圈）
  if(vcCombo>=2){
    var cx=240,cy=130,sc=1+vcComboPop*0.55;
    ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.textAlign='center';
    ctx.fillStyle='#0ff';ctx.shadowColor='#0ff';ctx.shadowBlur=16;ctx.font='bold 22px Arial';ctx.fillText('连击',0,-16);
    ctx.fillStyle='#fff';ctx.shadowColor='#0af';ctx.shadowBlur=18;ctx.font='bold 52px Arial';ctx.fillText('×'+vcCombo,0,30);
    ctx.restore();
  }
  // Boss warning（顶部脉动警告条；游戏持续运行不暂停，仅做醒目提示，消除"假暂停"错觉）
  if(bossWarningTimer>0){var bp=0.5+0.5*Math.sin(bossWarningTimer*0.4);
    // 顶部红色警告条（不遮挡中央游戏画面，玩家明显看到战机/子弹仍在动）
    ctx.fillStyle='rgba(170,0,0,'+(0.55+0.35*bp)+')';ctx.fillRect(0,0,480,48);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 24px Arial';
    ctx.shadowColor='#f00';ctx.shadowBlur=14+10*bp;
    ctx.fillText('\u26A0 BOSS \u6765\u88AD \u26A0',240,32);ctx.shadowBlur=0;
    // 中央轻提示（半透明，不挡操作）
    ctx.fillStyle='rgba(255,90,90,'+(0.55+0.35*bp)+')';ctx.font='bold 28px Arial';
    ctx.shadowColor='#f44';ctx.shadowBlur=16;ctx.fillText('\u51C6 \u5907 \u6218 \u6597',240,370);ctx.shadowBlur=0;
  }
  // Pause
  if(state=='pause'){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,480,720);
    ctx.textAlign='center';ctx.fillStyle='#0af';ctx.font='bold '+UF(44)+'px Arial';ctx.shadowColor='#0af';ctx.shadowBlur=20;ctx.fillText('暂停',240,170);ctx.shadowBlur=0;
    // 暂停菜单按钮（继续 / 重新开始 / 返回主菜单，参照正版雷霆战机布局）
    function pbtn(cx,cy,w,h,label,col){var x=cx-w/2,y=cy-h/2;ctx.fillStyle=col;ctx.strokeStyle='#0ff';ctx.lineWidth=2;ctx.shadowColor='#0ff';ctx.shadowBlur=8;drawRoundedRect(x,y,w,h,10);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold '+UF(22)+'px Arial';ctx.textAlign='center';ctx.fillText(label,cx,cy+8);}
    pbtn(240,240,UWw(220),UH(48),'\u25B6 继续游戏','rgba(0,120,200,0.9)');
    pbtn(240,312,UWw(220),UH(48),'\u21BB 重新开始','rgba(120,40,120,0.9)');
    pbtn(240,384,UWw(220),UH(48),'\u2630 选择关卡','rgba(0,160,120,0.9)');
    pbtn(240,456,UWw(220),UH(48),'\u2302 返回主菜单','rgba(180,20,20,0.9)');
    ctx.textAlign='center';
    // === 音乐控制区 ===
    // BGM 开关（媒体按钮：⏸暂停 / ▶播放）
    var mtbx=150,mtby=444,mtbw=180,mtbh=38;
    ctx.fillStyle='rgba(20,30,60,0.9)';ctx.strokeStyle='#0af';ctx.lineWidth=2;ctx.shadowColor='#0af';ctx.shadowBlur=8;
    drawRoundedRect(mtbx,mtby,mtbw,mtbh,8);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle='#0af';ctx.font='20px Arial';ctx.textAlign='left';ctx.fillText(bgmMuted?'\u25B6':'\u23F8',mtbx+20,mtby+26);
    ctx.fillStyle='#fff';ctx.font='17px Arial';ctx.textAlign='left';ctx.fillText(bgmMuted?'BGM 已关':'BGM 播放',mtbx+50,mtby+25);
    ctx.textAlign='center';
    // 切歌控件
    ctx.fillStyle='#bbf';ctx.font='15px Arial';ctx.textAlign='center';ctx.fillText('\u266B 切换歌曲',240,498);
    ctx.fillStyle='rgba(40,40,70,0.9)';ctx.strokeStyle='#88f';ctx.lineWidth=2;
    drawRoundedRect(120,512,52,44,8);ctx.fill();ctx.stroke();
    drawRoundedRect(308,512,52,44,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText('\u23EE',146,541);ctx.fillText('\u23ED',334,541);
    // 歌名放在两按钮中间同一行（按钮间距加大，空间更宽松）
    ctx.fillStyle='#ff0';ctx.font='bold 15px Arial';ctx.fillText(bgmName(bgmTrack),240,540);
    // 音量滑块（音效 / BGM），加大尺寸，点击或拖动实时调节
    ctx.fillStyle='#bbf';ctx.font='15px Arial';ctx.textAlign='left';ctx.fillText('\u266A 音效',60,606);
    ctx.fillStyle='#bbf';ctx.font='15px Arial';ctx.textAlign='right';ctx.fillText(Math.round(sfxVolume*100)+'%',420,606);
    ctx.fillStyle='rgba(40,40,70,0.9)';ctx.strokeStyle='#88f';ctx.lineWidth=2;ctx.textAlign='center';
    drawRoundedRect(130,598,200,18,9);ctx.fill();ctx.stroke();
    ctx.fillStyle='#0af';drawRoundedRect(130,598,Math.max(9,200*sfxVolume),18,9);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(130+200*sfxVolume,607,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#bbf';ctx.font='15px Arial';ctx.textAlign='left';ctx.fillText('\u266B 音乐',60,640);
    ctx.fillStyle='#bbf';ctx.font='15px Arial';ctx.textAlign='right';ctx.fillText(Math.round(bgmVolume*100)+'%',420,640);
    ctx.fillStyle='rgba(40,40,70,0.9)';ctx.strokeStyle='#88f';ctx.lineWidth=2;ctx.textAlign='center';
    drawRoundedRect(130,632,200,18,9);ctx.fill();ctx.stroke();
    ctx.fillStyle='#0af';drawRoundedRect(130,632,Math.max(9,200*bgmVolume),18,9);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(130+200*bgmVolume,641,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#555';ctx.font='16px Arial';ctx.textAlign='center';
    ctx.fillText('ESC 继续游戏 | '+(gameMode=='dual'?'P1:WASD  P2:方向键':'方向键/WASD/鼠标/触屏'),240,672);
  }
  // Game Over（被打死结束）
  if(state=='over'){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,480,720);
    ctx.textAlign='center';
    if(isBossRush){
      ctx.fillStyle='#f44';ctx.font='bold 42px Arial';ctx.shadowColor='#f44';ctx.shadowBlur=30;
      ctx.fillText('\u2620 Boss\u6311\u6218\u7ED3\u675F',240,180);ctx.shadowBlur=0;
      ctx.fillStyle='#fcc';ctx.font='bold 20px Arial';ctx.shadowColor='#f44';ctx.shadowBlur=10;
      ctx.fillText('\u2014\u2014 \u51FB\u6740 '+bossRushRound+' \u4E2ABoss \u2014\u2014',240,222);ctx.shadowBlur=0;
      ctx.fillStyle='#fff';ctx.font='26px Arial';ctx.fillText('\u2606 '+score,240,270);
      ctx.fillStyle='#ff9';ctx.font='18px Arial';ctx.fillText('\u6700\u9AD8\u8FDE\u51FB: x'+mcombo,240,310);
      ctx.fillStyle='#a84';ctx.font='16px Arial';ctx.fillText('Boss\u6311\u6218\u6700\u9AD8\u5206: '+bossRushHighScore,240,345);
      if(score>bossRushHighScore){bossRushHighScore=score;try{localStorage.setItem('tbr',bossRushHighScore);}catch(e){}}
    }else{
    ctx.fillStyle='#f44';ctx.font='bold '+UF(48)+'px Arial';ctx.shadowColor='#f44';ctx.shadowBlur=30;ctx.fillText('游戏结束',240,200);ctx.shadowBlur=0;
    // 明确说明这是"被打死"的情况
    ctx.fillStyle='#ff9a9a';ctx.font='bold 22px Arial';ctx.shadowColor='#f44';ctx.shadowBlur=12;
    ctx.fillText('—— 你的战机被击毁了 ——',240,242);ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='26px Arial';ctx.fillText('\u2606 '+score,240,290);
    ctx.fillStyle='#aaa';ctx.font='18px Arial';ctx.fillText(getLv().name+' | 最高连击: x'+mcombo,240,330);
    ctx.fillStyle='#666';ctx.font='16px Arial';ctx.fillText('最高分: '+hs,240,368);
    }
    ctx.fillStyle=isBossRush?'#fcc':'#aaa';ctx.font=UF(20)+'px Arial';ctx.fillText('点击返回主菜单',240,455);
    ctx.save();ctx.translate(240,540);
    ctx.shadowColor=isBossRush?'#f44':'#f44';ctx.shadowBlur=15;ctx.fillStyle=isBossRush?'#f44':'#f44';
    ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(-12,12);ctx.lineTo(-5,9);ctx.lineTo(0,14);ctx.lineTo(5,9);ctx.lineTo(12,12);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle=isBossRush?'#f88':'#f88';
    ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(-6,7);ctx.lineTo(0,10);ctx.lineTo(6,7);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  // Level Complete（打通关结束）
  if(state=='levelComplete'){
    // 压暗背景
    ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,480,720);
    ctx.textAlign='center';
    // 中央光带，增强"结算面板"质感（蓝橙科幻感，贴近正版雷霆战机）
    var _cg=ctx.createLinearGradient(0,150,0,540);
    _cg.addColorStop(0,'rgba(30,60,120,0)');_cg.addColorStop(0.5,'rgba(40,90,170,0.30)');_cg.addColorStop(1,'rgba(30,60,120,0)');
    ctx.fillStyle=_cg;ctx.fillRect(0,150,480,390);
    // 标题 ★ 通关 ★（金色大发光）
    ctx.fillStyle='#ffd700';ctx.font='bold '+UF(46)+'px Arial';ctx.shadowColor='#ff8c00';ctx.shadowBlur=28;
    ctx.fillText('\u2605 通关 \u2605',240,188);ctx.shadowBlur=0;
    // 副标题（击败 BOSS / 全部通关）
    if(currentLevel<TOTAL_LEVELS){
      ctx.fillStyle='#bfffd0';ctx.font='bold 20px Arial';ctx.shadowColor='#0f0';ctx.shadowBlur=10;
      ctx.fillText('—— 你击败 BOSS，成功通关本关 ——',240,216);ctx.shadowBlur=0;
    }else{
      ctx.fillStyle='#ffd27f';ctx.font='bold 20px Arial';ctx.shadowColor='#f80';ctx.shadowBlur=10;
      ctx.fillText('—— 你通关了全部 40 关！——',240,216);ctx.shadowBlur=0;
    }
    // 关卡名
    ctx.fillStyle='#cfe8ff';ctx.font='18px Arial';ctx.fillText(getLv().name,240,248);
    // ===== 得分主视觉（正版风格：居中超大金色发光数字 + SCORE 标签）=====
    ctx.fillStyle='#9fd0ff';ctx.font='bold 16px Arial';ctx.fillText('本 关 得 分    SCORE',240,292);
    ctx.font='bold '+UF(52)+'px Arial';ctx.shadowColor='#ffcf00';ctx.shadowBlur=24;
    ctx.fillStyle='#ffd700';ctx.strokeStyle='#7a4b00';ctx.lineWidth=4;
    ctx.strokeText(String(score),240,352);ctx.fillText(String(score),240,352);ctx.shadowBlur=0;
    // 分隔线
    ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(120,378);ctx.lineTo(360,378);ctx.stroke();
    // 次要数据：最高连击 + 获得天赋（双列对称）
    ctx.textAlign='right';ctx.fillStyle='#ffe27a';ctx.font='bold 17px Arial';ctx.fillText('最高连击   x'+mcombo,228,408);
    ctx.textAlign='left';ctx.fillStyle='#aaccff';ctx.fillText('获得天赋   +'+lastTpGain,252,408);
    ctx.textAlign='center';
    // 按钮（保持原坐标，点击区 my 430~480 不变）
    if(currentLevel<TOTAL_LEVELS){ctx.fillStyle='#0a3';ctx.strokeStyle='#0f0';ctx.lineWidth=2;drawRoundedRect(145,430,70,50,6);ctx.fill();ctx.stroke();}
    ctx.fillStyle='#aaa';ctx.strokeStyle='#888';ctx.lineWidth=2;
    var cx=currentLevel<TOTAL_LEVELS?300:240,bw=currentLevel<TOTAL_LEVELS?80:120;
    drawRoundedRect(cx-bw,430,bw*2,50,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold '+UF(18)+'px Arial';
    if(currentLevel<TOTAL_LEVELS)ctx.fillText('\u25B6 下一关',180,462);
    ctx.fillText('\u2699 选择关卡',cx,462);
    // 按钮下方提示
    if(currentLevel<TOTAL_LEVELS){
      ctx.fillStyle='#7fffa0';ctx.font='bold 16px Arial';ctx.shadowColor='#0f0';ctx.shadowBlur=6;
      ctx.fillText('\u25B6 第'+(currentLevel+1)+'关已解锁',240,505);ctx.shadowBlur=0;
    }else{
      ctx.fillStyle='#ffd27f';ctx.font='bold 18px Arial';ctx.fillText('\uD83C\uDFC6 恭喜通关全部关卡！',240,505);
    }
    ctx.fillStyle='#ffd700';ctx.font='bold 16px Arial';ctx.fillText('天赋点共 '+talentPoints,240,528);
  }
  // Tutorial
  if(state=='playing'&&!tutorialSeen&&fadeAlpha<0.5){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,480,720);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 22px Arial';
    ctx.fillText('\u25B6 移动鼠标/手指控制战机',240,250);
    ctx.fillText('\u25B6 自动射击，躲避敌人子弹',240,330);
    ctx.fillText('\u25B6 收集道具 \u25A0\u25A0\u25A0 强化火力',240,410);
    ctx.fillText('\u25B6 击败 BOSS 通关',240,490);
    ctx.fillStyle='#888';ctx.font='16px Arial';ctx.fillText('点击任意位置开始',240,620);
  }
  // Mobile alert
  if(mobileMsgTimer>0){
    mobileMsgTimer--;
    ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,480,720);
    var lines=mobileMsg.split('\n');
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 26px Arial';ctx.shadowColor='#ff6b6b';ctx.shadowBlur=20;
    ctx.fillText(lines[0],240,330);ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='18px Arial';
    for(var li=1;li<lines.length;li++)ctx.fillText(lines[li],240,375+li*30);
    ctx.fillStyle='#0af';ctx.font='bold 18px Arial';ctx.fillText('\u70B9\u51FB\u4EFB\u610F\u5904\u5173\u95ED',240,470);
  }
  // 进入关卡提示
  if(enterMsgTimer>0&&state=='playing'){
    enterMsgTimer--;
    var a=Math.min(1,enterMsgTimer/40);
    ctx.fillStyle='rgba(0,0,0,'+(0.55*a)+')';ctx.fillRect(0,300,480,120);
    ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.font='bold 26px Arial';ctx.shadowColor='#0af';ctx.shadowBlur=15;
    ctx.fillText(enterMsg,240,365);ctx.shadowBlur=0;
  }
  // 首屏开始遮罩（仅提示点击开始，不重复绘制标题大字，避免背景出现多余文字）
  if(needStart){
    ctx.fillStyle='rgba(0,0,0,0.92)';ctx.fillRect(0,0,480,720);
    ctx.textAlign='center';
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';
    ctx.fillText('\u25B6 点击屏幕开始游戏',240,360);
    ctx.fillStyle='#9ab';ctx.font='15px Arial';
    ctx.fillText('（首次点击将开启音乐与音效）',240,410);
    ctx.fillStyle='#0af';ctx.font='17px Arial';
    ctx.fillText('\u2708 单人 / 双人  ·  DIY皮肤  ·  本地BGM',240,560);
    ctx.restore();return;
  }
  // 受击氛围：屏幕边缘向内渐变光晕（按攻击类型着色，强度由 hitFx 控制）
  if((state=='playing'||state=='over')&&hitFx>0){
    var a=hitFx;
    ctx.save();
    // 四边向内的红色/紫色受击光晕（用径向渐变模拟边缘脉冲）
    var g1=ctx.createLinearGradient(0,0,0,160);g1.addColorStop(0,'rgba('+hitFxColor+','+(a*0.55)+')');g1.addColorStop(1,'rgba('+hitFxColor+',0)');
    ctx.fillStyle=g1;ctx.fillRect(0,0,480,160);
    var g2=ctx.createLinearGradient(0,720,0,720-160);g2.addColorStop(0,'rgba('+hitFxColor+','+(a*0.55)+')');g2.addColorStop(1,'rgba('+hitFxColor+',0)');
    ctx.fillStyle=g2;ctx.fillRect(0,560,480,160);
    var g3=ctx.createLinearGradient(0,0,160,0);g3.addColorStop(0,'rgba('+hitFxColor+','+(a*0.45)+')');g3.addColorStop(1,'rgba('+hitFxColor+',0)');
    ctx.fillStyle=g3;ctx.fillRect(0,0,160,720);
    var g4=ctx.createLinearGradient(480,0,480-160,0);g4.addColorStop(0,'rgba('+hitFxColor+','+(a*0.45)+')');g4.addColorStop(1,'rgba('+hitFxColor+',0)');
    ctx.fillStyle=g4;ctx.fillRect(320,0,160,720);
    // 外圈描边脉冲，强化"被击中"氛围
    ctx.strokeStyle='rgba('+hitFxColor+','+(a*0.8)+')';ctx.lineWidth=6;ctx.strokeRect(3,3,474,714);
    ctx.restore();
  }
  // Fade overlay
  if(fadeAlpha>0){ctx.fillStyle='rgba(0,0,0,'+fadeAlpha+')';ctx.fillRect(0,0,480,720);}

  ctx.restore();
}

function loop(){try{update();draw();}catch(e){console.error('GAME ERROR:',e);var _d=document.getElementById('_err')||(function(){var _e=document.createElement('div');_e.id='_err';_e.style.cssText='position:fixed;top:0;left:0;color:#f44;font:14px monospace;background:rgba(0,0,0,0.85);z-index:99999;padding:8px 12px;max-width:100%;pointer-events:none;white-space:pre-wrap;word-break:break-all';document.body.appendChild(_e);return _e;})();_d.textContent='JS ERROR: '+(e.message||e)+' at '+(e.stack||'').split('\n')[0];}requestAnimationFrame(loop);}
loadAssets();
loop();
// 首屏需要用户点击一次（浏览器自动播放限制 + 明确开始）
function doStart(){
  if(!needStart)return;
  needStart=false;
  // iOS: 必须在手势同步栈里 resume AudioContext + 启动 BGM
  var ctx=ac();
  if(ctx.state==='suspended'){ctx.resume();}
  startBGM();
}
document.addEventListener('pointerdown',doStart,true);
document.addEventListener('keydown',doStart,true);
document.addEventListener('touchstart',doStart,true);
