<!DOCTYPE html>
<html>

<style>
* {margin:0;padding:0;box-sizing:border-box}
html,body{width:100%}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;max-width:none;max-height:none;border:2px solid #0af;transition:transform .26s cubic-bezier(.22,.61,.36,1),opacity .26s ease}
#transitionMask{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9999}
.wb-ov{display:none;position:fixed;inset:0;z-index:9998;align-items:center;justify-content:center;background:rgba(0,0,10,0.82);font-family:Arial,"Microsoft YaHei",sans-serif}
.wb-card{background:linear-gradient(160deg,#101838,#1a1040);border:2px solid #ffb43a;box-shadow:0 0 30px rgba(255,150,40,0.5);border-radius:16px;padding:26px 22px;max-width:86%;text-align:center;color:#fff}
.wb-pt{font-size:21px;font-weight:bold;color:#ffd98a;margin-bottom:10px}
.wb-lt{font-size:25px;font-weight:bold;margin-bottom:10px}
.wb-pd{font-size:14px;color:#cde;margin-bottom:18px;line-height:1.6}
.wb-btn{margin-top:6px;padding:12px 26px;font-size:17px;font-weight:bold;color:#1a1040;background:linear-gradient(180deg,#ffd98a,#ffae3a);border:none;border-radius:10px;cursor:pointer}
.st-card{width:84%;max-width:380px;background:linear-gradient(160deg,rgba(18,28,56,0.97),rgba(10,16,38,0.97));border:1px solid rgba(63,208,255,0.5);border-radius:18px;padding:20px 18px;box-shadow:0 0 40px rgba(63,208,255,0.25),inset 0 0 30px rgba(63,208,255,0.08);text-align:left;animation:stpop .25s ease;max-height:86vh;overflow:auto}
@keyframes stpop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.st-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.st-ava{font-size:26px;filter:drop-shadow(0 0 6px rgba(63,208,255,.6))}
.st-who{font-weight:bold;color:#ffd98a;font-size:18px}
.st-m{margin-left:auto;font-size:13px;color:#7fd0ff;background:rgba(63,208,255,.12);padding:2px 10px;border-radius:20px}
.st-t{font-size:13px;color:#9ab;letter-spacing:1px;margin-bottom:10px;border-left:3px solid #ffb43a;padding-left:8px}
.st-txt{min-height:64px;font-size:16px;line-height:1.7;color:#e8f0ff;white-space:pre-wrap}
.st-txt::after{content:'▍';color:#3fd0ff;animation:stblink 1s steps(1) infinite}
.st-txt.done::after{content:''}
@keyframes stblink{50%{opacity:0}}
.st-ch{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.st-btn{cursor:pointer;border:none;border-radius:12px;padding:11px 14px;font:bold 15px Arial;color:#fff;background:linear-gradient(135deg,rgba(63,208,255,.25),rgba(40,70,120,.5));border:1px solid rgba(63,208,255,.5);transition:transform .12s,background .12s;width:100%;text-align:left}
.st-btn:hover{transform:translateY(-2px);background:linear-gradient(135deg,rgba(63,208,255,.45),rgba(40,70,120,.7))}
.st-chb{background:linear-gradient(135deg,rgba(199,123,255,.22),rgba(60,30,90,.5));border-color:rgba(199,123,255,.55)}
.st-chb:hover{background:linear-gradient(135deg,rgba(199,123,255,.42),rgba(60,30,90,.7))}
.st-foot{margin-top:12px;text-align:right}
.st-next{width:auto;text-align:center;padding:9px 22px}
</style>
<script src="jquery-3.7.1.min.js"></script>
</head>

<script>
// === SETUP ===
var c=document.getElementById('c'),ctx=c.getContext('2d');
var _isMobile=/Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent)||('ontouchstart' in window&&Math.max(window.innerWidth,window.innerHeight)<900);

function vh(){var v=window.innerHeight;if(window.visualViewport&&window.visualViewport.height)v=window.visualViewport.height;return v||document.documentElement.clientHeight||window.innerHeight;}

  var ww=window.innerWidth,wh=vh();

  var cw,ch;
  if(ww>=wh){
    // 横屏/桌面：完整显示游戏（contain），并限制最大 480x720，避免过大或被裁切
    var cap=720; if(wh<cap)cap=wh;

  c.style.height=Math.floor(ch)+'px';

}
resizeCanvas();window.addEventListener('resize',resizeCanvas);

ctx.scale(DPR,DPR);
// 全局限制 shadowBlur 上限（Canvas 阴影模糊是 GPU 最大开销）
try{var _sd=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'shadowBlur');if(_sd&&_sd.set){Object.defineProperty(CanvasRenderingContext2D.prototype,'shadowBlur',{configurable:true,enumerable:true,get:function(){return _sd.get.call(this);},set:function(v){_sd.set.call(this,0);}});}}catch(e){}
// 对象池：复用子弹/粒子对象，避免每帧大量分配触发移动端 GC 长卡顿（完全不影响画面与玩法，且清空字段保证无残留）

try{uiStep=parseInt(localStorage.getItem('tb_ui')||'0')||0;}catch(e){}
if(uiStep<0)uiStep=0;if(uiStep>2)uiStep=2;
uiScale=[1,1.12,1.26][uiStep];

function UWw(w){return Math.round(w*uiScale);}    // 宽度缩放
function UWb(x,w){return Math.round(x+(w-w*uiScale)/2);} // 非居中按钮缩放后左缘

var novaRing=0;         // 环形冲击波半径
var novaRingLast=0;     // 上一帧环形冲击波半径（用于碰撞检测）
var novaRingAlpha=0;    // 环形冲击波透明度
var novaStars=[];       // 星爆粒子数组
var needStart=false;
var countdownTimer=0; // 开场倒计时帧数（240=4秒，0=未激活）
var tutTimer=0; // 开局教程遮罩自动消失计时（帧数）
var px,py,hp,mhp,pt,pi,playerInvuln=0,playerBurnTimer=0;
var mxRaw=240,myRaw=640; // 始终记录原始光标位置（暂停时也能追踪），用于恢复游戏时把飞机snap到光标

var bls=[],ens=[],pts=[],pws=[],drs=[],stars=[],lasers=[],wingLasers=[],et=0,df=1,keys={};
// 初始化视差星空（三层：远/中/近，速度/大小/亮度不同）+ 偶尔流星
for(var _si=0;_si<170;_si++){var _sl=_si%3;var _cc=Math.random();var _r=_cc<0.18?180:_cc<0.34?255:255,_g=_cc<0.18?220:_cc<0.34?205:255,_b=_cc<0.18?255:_cc<0.34?170:255;stars.push({x:Math.random()*480,y:Math.random()*720,l:_sl,v:_sl==0?0.4:_sl==1?0.9:1.6,ph:Math.random()*6.28,twinkle:0.5,r:_r,g:_g,b:_b,col:'rgba('+_r+','+_g+','+_b+',1)'});}
var comet=null,cometTimer=90;
var wave=0,waveEnemies=0,waveMax=0,spawnTimer=0,bossWarningTimer=0;

var PBULLET_SPEED=2.0;  // 玩家子弹移动速度倍率（保持较快离场，避免滞留堆积卡顿）
var EBULLET_SPEED=1.3;  // 敌人子弹移动速度倍率（适中）
var ENEMY_SPD_MUL=1.2;  // 敌机下落速度倍率（适中）
var SPAWN_MUL=0.55;     // 刷怪间隔倍率（越小越密集，敌人出现越快）
var ENEMY_FIRE_MUL=1.2; // 敌机开火间隔倍率（越小开火越密，节奏更紧凑）
// 立即生成大 Boss（预警期间玩家点击/触摸时调用，或倒计时归零时自动调用）
function spawnBoss(){if(bossWarningTimer<=0&&state!='playing')return;bossWarningTimer=0;var lv=getLv();var count=currentLevel>=30?4:currentLevel>=20?3:currentLevel>=10?2:1;for(var i=0;i<count;i++){var bb=BIGBOSSES[((currentLevel-1)+i)%BIGBOSSES.length];var bossHP=Math.round(lv.bossHp*bb.hpMul);var e={x:240+(i-(count-1)/2)*60,y:-60-i*30,vx:0,vy:1.2,hp:bossHP,maxHp:bossHP,type:'boss',isBig:true,name:bb.name,color:bb.color,cl2:bb.cl2,skin:bb.skin,w:80,h:60,t:0,fireTimer:i*10,phase:1,abilities:bb};if(bb.shield)e.shieldHP=bossHP*0.3;if(bb.revive)e.revive=true;if(bb.burnBullets)e.burnBullets=true;ens.push(e);}wShield=1+tl('shield');play('shield');var fn=BIGBOSSES[(currentLevel-1)%BIGBOSSES.length].name;if(count>=3)speakText('大 boss 集群降临！',0.9,1.3);else if(count==2)speakText('两名大 boss 降临！',0.9,1.3);else speakBossArrival(fn,true);}
// BOSS挑战：直接生成一个Boss（跳过小兵）
function spawnBossRushBoss(){

  var hpScale=0.25+bossRushRound*0.12;

  if(bb.shield)e.shieldHP=bossHP*0.3;if(bb.revive)e.revive=true;if(bb.burnBullets)e.burnBullets=true;  ens.push(e);

var SHIELD_BREAK_DUR=30;

function triggerShieldBreak(){
  var n=6+Math.floor(Math.random()*3), lines=[];

function loadAssets(){

  if(!IMG_LOADED){
    IMG_LOADED=true;
    for(var _i=0;_i<IMG_SKINS.length;_i++){
      (function(o){
        var im=new Image();
        im.onload=function(){IMG_CACHE[o.key]=this;};

      ASSETS=d;ASSETS_READY=true;

}

      bgmIndex++;playBGMList();
    }
  }else{
    // 没有 mp3 文件也没有嵌入数据 → 回退到合成 BGM（极旧环境）
    if(bgmAudio){try{bgmAudio.pause();bgmAudio=null;}catch(e){}}

    return;
  }
}
function switchBGM(key){
  if(bgmPlayList.indexOf(key)<0)return;
  // 停止之前的合成 BGM 和超时定时器
  stopBGM();
  bgmTrack=key;try{localStorage.setItem('tbt',key);}catch(e){}
  bgmResumeTime=0;
  bgmIndex=bgmPlayList.indexOf(key);
  playBGMList();
}
function synthBGM(){
  var tr=bgmTracks[bgmTrack]||bgmTracks.default;
  var idx=0,step=tr.mel.length;
  function next(){
    var c=ac(),now=c.currentTime,spb=tr.dur*0.001; // 每步秒数
    // 主旋律
    var o=c.createOscillator(),g=c.createGain();o.type=tr.type;o.frequency.value=tr.mel[idx];
    g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(tr.vol*bgmVolume*MASTER_GAIN,now+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+spb*0.9);
    o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+spb);bgmNodes.push(o);
    // 低音
    var o2=c.createOscillator(),g2=c.createGain();o2.type='sine';o2.frequency.value=tr.bass[idx];
    g2.gain.setValueAtTime(0.0001,now);g2.gain.exponentialRampToValueAtTime(tr.vol*bgmVolume*MASTER_GAIN*0.8,now+0.02);g2.gain.exponentialRampToValueAtTime(0.0001,now+spb*0.95);
    o2.connect(g2);g2.connect(c.destination);o2.start(now);o2.stop(now+spb);bgmNodes.push(o2);
    // 和弦铺底（每2步一次）
    if(idx%2==0){var o3=c.createOscillator(),g3=c.createGain();o3.type='sine';o3.frequency.value=tr.chord[idx];
      g3.gain.setValueAtTime(0.0001,now);g3.gain.exponentialRampToValueAtTime(tr.vol*bgmVolume*MASTER_GAIN*0.35,now+0.05);g3.gain.exponentialRampToValueAtTime(0.0001,now+spb*1.8);
      o3.connect(g3);g3.connect(c.destination);o3.start(now);o3.stop(now+spb*2);bgmNodes.push(o3);}
    idx=(idx+1)%step;
    bgmTimer=setTimeout(next,tr.dur);
  }
  next();
}
function stopBGM(){
  if(bgmTimer){clearTimeout(bgmTimer);bgmTimer=null;}
  bgmNodes=[];if(bgmAudio){try{bgmAudio.pause();bgmAudio.currentTime=0;}catch(e){}bgmAudio=null;}
}
function applyBgmVolume(){if(bgmAudio&&!bgmAudio.paused)bgmAudio.volume=Math.min(1,bgmVolume);}
function applyBgmMute(){
  if(bgmAudio){
    if(bgmMuted){try{bgmAudio.pause();}catch(e){}}
    else{
      var pr=bgmAudio.play();
      if(pr&&pr.catch)pr.catch(function(){});
      applyBgmVolume();
    }
  }else if(!bgmMuted&&state=='menu'){
    // 若音频对象不存在但取消静音，尝试重新启动 BGM
    startBGM();
  }
}

function firePassiveMissiles(){
  if(state!='playing')return;
  var P1=wPower;
  var ml=tl('missile'); // 导弹被动天赋等级
  var perSide=1+Math.min(ml,4);          // 每侧导弹数随天赋增加
  var md=P1*(1+0.3*ml);                   // 伤害随天赋提升
  var spread=0.18;                        // 同侧多枚扇形展开角度
  function emit(cx,cy,fromP1){
    var dropBonus=homingTimer>0?2:0; // 限时追踪期间，炮台导弹额外加量
    var n=perSide+dropBonus;
    for(var s=-1;s<=1;s+=2){
      for(var k=0;k<n;k++){
        var off=(k-(n-1)/2)*spread;
        var ang=-Math.PI/2 + s*0.9 + off; // 斜外上 + 扇形偏移
        var sp=4.2;
        var nb=newBullet();nb.x=cx+s*26;nb.y=cy-6;nb.vx=Math.cos(ang)*sp;nb.vy=Math.sin(ang)*sp;nb.d=md;nb.w=13;nb.h=30;nb.cl='#39ff14';nb.pl=true;nb.from=fromP1?1:2;nb.homing=true;nb.turn=0.42;nb.life2=9999;bls.push(nb);

  }

}

// === 游戏内按钮检测（统一被遮罩层盖住前优先执行） ===
function handleGameButton(mx,my){
  if(state!=='playing')return false;
  // Boss预警
  if(bossWarningTimer>0){spawnBoss();return true;}
  // 暂停按钮
  if(my>6&&my<50&&mx>428&&mx<472){state='pause';play('menuClick');return true;}
  // 炸弹
  if(my>640&&my<710&&mx>400&&mx<470){useBomb();return true;}
  // 必杀
  if(novaUnlocked){
    var ubw2=80,ubh2=54,ugap2=6;
    var uCountR2=0,uCountL2=0;
    for(var ui2=0;ui2<ULT_SKILLS.length;ui2++){var us2=ULT_SKILLS[ui2];if(tl(us2.talentId)<=0)continue;
      var sideR2=(uCountR2<=uCountL2);
      var ux2=sideR2?400:10;
      var uy2=sideR2?(640-10-ubh2-uCountR2*(ubh2+ugap2)):(655-ubh2-uCountL2*(ubh2+ugap2));
      if(my>uy2&&my<uy2+ubh2&&mx>ux2&&mx<ux2+ubw2){
        selectedUlt=ui2;
        if(skillCds[selectedUlt]<=0){useNova();}else{play('menuClick');}
        return true;
      }
      if(sideR2)uCountR2++;else uCountL2++;
    }
  }
  return false;
}

c.ontouchstart=function(e){
  e.preventDefault();
  for(var ti=0;ti<e.changedTouches.length;ti++){
    var t=e.changedTouches[ti];
    if(!t)continue;
    var r=c.getBoundingClientRect();
    var tx=(t.clientX-r.left)*480/r.width;
    var ty=(t.clientY-r.top)*720/r.height;
    mxRaw=Math.round(tx);myRaw=Math.round(ty);
    touchStartY=t.clientY;touchMoved=false;
    // 非playing界面：天赋页拖动或菜单点击
    if(state!=='playing'){
      if(state=='talent'){touchStartY=t.clientY;}
      continue;
    }
    // 先检查游戏按钮
    if(handleGameButton(tx,ty)){buttonTouchId=t.identifier;continue;}
    // 直接触控移动玩家（Boss预警期间也允许移动，避免点不动）
    px=Math.round(tx);py=Math.round(ty);
  }
};
c.ontouchmove=function(e){
  e.preventDefault();
  for(var ti=0;ti<e.changedTouches.length;ti++){
    var t=e.changedTouches[ti];
    if(!t)continue;
    var r=c.getBoundingClientRect();
    var tx=(t.clientX-r.left)*480/r.width;
    var ty=(t.clientY-r.top)*720/r.height;
    if(state=='talent'){
      var dy=t.clientY-touchStartY;
      if(Math.abs(dy)>8){touchMoved=true;talentScroll-=dy*1.8;var maxS=Math.max(0,120+TALENTS.length*72+64-636);if(talentScroll<0)talentScroll=0;if(talentScroll>maxS)talentScroll=maxS;touchStartY=t.clientY;}
      continue;
    }
    if(state!='playing')continue;
    // 直接触控移动玩家
    if(t.identifier!==buttonTouchId){
      px=Math.round(tx);py=Math.round(ty);
    }
  }
};
c.ontouchend=function(e){
  e.preventDefault();
  for(var ti=0;ti<e.changedTouches.length;ti++){
    var t=e.changedTouches[ti];
    if(!t)continue;
    var r=c.getBoundingClientRect();
    var tx=(t.clientX-r.left)*480/r.width;
    var ty=(t.clientY-r.top)*720/r.height;
    // 已被ontouchstart拦截的按钮触摸，松手时不再重复触发
    if(t.identifier===buttonTouchId){buttonTouchId=-1;continue;}
    // 非摇杆触摸结束：若未滑动，当点击处理
    if(!touchMoved){
      // 先尝试游戏按钮
      if(state=='playing'){if(handleGameButton(tx,ty))continue;}
      handleClick(tx,ty);
    }
  }
};

  // Airdrops（降落伞缓慢下落 + 轻微左右飘摆）
  for(var i=drs.length-1;i>=0;i--){var d=drs[i];d.y+=d.vy;d.t++;d.sway+=0.02;d.x+=Math.sin(d.sway)*0.4;if(d.x<20)d.x=20;if(d.x>460)d.x=460;if(d.y>730){drs.splice(i,1);continue;}
    if(Math.abs(d.x-px)<(d.boxW+20)/2&&Math.abs(d.y-py)<(d.boxH+20)/2){openAirdrop(i,true);continue;}

  }
  // Particles
  for(var i=pts.length-1;i>=0;i--){var p=pts[i];p.life--;if(p.life<=0){ptsPool.push(p);pts.splice(i,1);continue;}if(p.vx!==void 0){p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;}else p.y+=p.vy;}
  // 数组上限保护：防止粒子/子弹爆炸导致卡顿。
  // 注意：超出的对象必须回收到对象池（不能只 splice 丢棄），否则等于持续制造垃圾、加重 GC 卡顿。
  if(pts.length>200){var _pOver=pts.length-200;for(var _pc=0;_pc<_pOver;_pc++)ptsPool.push(pts[_pc]);pts.splice(0,_pOver);}
  if(bls.length>BLS_MAX){var _bOver=bls.length-BLS_MAX;for(var _bc=0;_bc<_bOver;_bc++)blsPool.push(bls[_bc]);bls.splice(0,_bOver);}

    if(wave<getLv().waveCount){startWave();}else{
      state='levelComplete';speakText('闯关成功！',1,1.1);
      // 评价：残血比例 + 是否用炸弹少

      else if(hpRate>=0.5)rk='A';
      else if(hpRate>=0.25)rk='B';

      try{var key='trk_'+currentLevel;var prev=localStorage.getItem(key)||'D';var order={'S':4,'A':3,'B':2,'C':1,'D':0};if((order[rk]||0)>(order[prev]||0))localStorage.setItem(key,rk);}catch(e){}
      if(currentLevel>=unlockedLevels&&currentLevel<TOTAL_LEVELS){unlockedLevels=currentLevel+1;try{localStorage.setItem('tul',unlockedLevels);}catch(e){}}
      if(score>hs){hs=score;try{localStorage.setItem('ths',hs);}catch(e){}}
      // 记录"上次游玩关卡"，下次同一设备自动续玩（最后一关或已通过的关）
      try{lastPlayedLevel=Math.min(currentLevel+1,unlockedLevels);localStorage.setItem('tlp',lastPlayedLevel);}catch(e){}
      // 发放天赋点（每次通关都给，难度越高越多；首次打通全40关正好点满）
      var tpGain=getTpReward(currentLevel);talentPoints+=tpGain;lastTpGain=tpGain;saveTalents();

      winFlash=1;
      play('levelComplete');
      onLevelClear();
    }
  }

  if(isBossRush&&state=='playing'&&!ens.length&&bossRushTimer<=0){
    bossRushRound++;bossRushTimer=90;countdownTimer=90;state='countdown';
    hp=Math.min(mhp,hp+5);bombs=maxBombs;play('levelComplete');onBossRushRound();
  }
  // 玩家燃烧 DoT（被 boss 燃烧子弹击中后的持续掉血）
  if(playerBurnTimer>0){playerBurnTimer--;if(playerBurnTimer%20==0&&playerBurnTimer>0){hp--;play('playerHit');boom(px,py,'#f80',3);if(hp<=0){state='over';play('gameOver');speakText('游戏结束',0.9,1.1);}}}

  if(pi>0)pi--;
}

}

function buyTalent(id){
  var t=findTalent(id);if(!t)return;var cur=tl(id);
  if(cur>=t.max)return;if(talentPoints<t.cost)return;
  talentPoints-=t.cost;talentLv[id]=cur+1;saveTalents();play('menuClick');
  // 购买必杀后立即生效（不需要重新开始关卡）
  if(id=='nova'){novaUnlocked=true;skillCds=new Array(ULT_SKILLS.length).fill(0);selectedUlt=0;}
  // novaCd discount applied in useUlt() via tl('novaCd')
  if(id=='novaDmg'){novaDmgMul=1+tl('novaDmg')*0.25;}
  // 新必杀技解锁后自动选中
  for(var ui=0;ui<ULT_SKILLS.length;ui++){var us=ULT_SKILLS[ui];if(tl(us.talentId)>0)selectedUlt=ui;}
}

    ctx.strokeStyle='#000';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,4,3,0.1,3.04);ctx.stroke();

    ctx.beginPath();ctx.ellipse(0,4,2.5,1.8,0,0,6.28);ctx.fill();

    ctx.fillStyle=col||'#000';ctx.beginPath();ctx.arc(0,1,5,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,2,3,0,6.28);ctx.fill();

    ctx.strokeStyle=col||'#000';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,6,3,0.1,3.04);ctx.stroke();
  }
  ctx.restore();
}

// ===== 护盾光圈绘制（青色清晰圆环，非金色氛围；局部坐标，须在战机 translate 后、restore 前调用）=====
function drawShieldAura(sh){
  if(!sh||sh<=0)return;               // 只按传入的护盾层数绘制
  var _inv=playerInvuln;
  var _pulse=0.5+0.5*Math.sin(frameCount*0.12);            // 呼吸脉动
  var _hit=(_inv>0)?Math.min(1,_inv/30):0;                 // 受击/刚挡下时更亮
  var _rx=40+sh*3,_ry=52+sh*3;                             // 层数越多环越大
  ctx.save();
  // 极淡青色填充，仅作护盾质感，不产生“氛围”感（区别于原来金色大光晕）
  var _g=ctx.createRadialGradient(0,-4,8,0,-4,Math.max(_rx,_ry));
  _g.addColorStop(0,'rgba(120,210,255,0)');
  _g.addColorStop(1,'rgba(80,180,255,'+(0.06+0.04*sh)+')');
  ctx.fillStyle=_g;ctx.beginPath();ctx.ellipse(0,-4,_rx,_ry,0,0,6.28);ctx.fill();
  // 主光圈（清晰青色描边环，受击时爆亮，范围克制不扩散）
  ctx.lineWidth=2.5;ctx.strokeStyle='rgba(150,230,255,'+(0.7+0.3*_pulse+0.3*_hit)+')';
  ctx.shadowColor='#5cc8ff';ctx.shadowBlur=8+8*_hit;
  ctx.beginPath();ctx.ellipse(0,-4,_rx,_ry,0,0,6.28);ctx.stroke();
  ctx.restore();
}
// 战机两侧炮台绘制：明显放大、发光、带脉冲蓄能环，确保清晰可见
function drawTurrets(){
  var t=frameCount*0.15;
  for(var s=-1;s<=1;s+=2){
    var tx=s*TURRET_DX, ty=TURRET_DY+6;
    // 外层脉冲光环（蓄能感）
    var pulse=0.55+0.45*Math.sin(t);
    ctx.fillStyle='rgba(0,229,255,'+(0.18*pulse)+')';
    ctx.beginPath();ctx.arc(tx,ty,16,0,6.28);ctx.fill();
    // 炮座（大圆 + 发光描边）
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=14;
    ctx.fillStyle='#1b2a44';ctx.beginPath();ctx.arc(tx,ty,11,0,6.28);ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle='#00e5ff';ctx.stroke();
    ctx.shadowBlur=0;
    // 炮管（两边都朝上、朝外：左炮台斜左上，右炮台斜右上）
    ctx.save();ctx.translate(tx,ty);ctx.rotate(s*Math.PI/4);
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=10;
    ctx.fillStyle='#7fe9ff';ctx.fillRect(-5,-22,10,22);
    ctx.fillStyle='#cffaff';ctx.fillRect(-2,-22,4,22); // 高光
    ctx.shadowBlur=0;
    ctx.restore();
    // 炮口蓄能光点（亮青，脉冲，位于斜外上炮口）
    ctx.fillStyle='rgba(180,250,255,'+(0.6+0.4*Math.sin(t))+')';
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(tx+s*15,ty-15,4,0,6.28);ctx.fill();
    ctx.shadowBlur=0;
  }
}

    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-6,-4,2,0,6.28);ctx.arc(6,-4,2,0,6.28);ctx.fill();
    // 胡须
    ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-4,1);ctx.lineTo(-14,0);ctx.moveTo(-4,2);ctx.lineTo(-14,3);ctx.moveTo(4,1);ctx.lineTo(14,0);ctx.moveTo(4,2);ctx.lineTo(14,3);ctx.stroke();
  }else if(form==2){ // 公主浅浅：粉裙大眼萌妹
    ctx.shadowColor='#ff69b4';ctx.shadowBlur=16;ctx.fillStyle='#ff9ec7';
    ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(-15,12);ctx.quadraticCurveTo(0,18,15,12);ctx.closePath();ctx.fill(); // 粉裙
    ctx.shadowBlur=0;ctx.fillStyle='#ffd1e8';ctx.beginPath();ctx.ellipse(0,-6,9,10,0,0,6.28);ctx.fill(); // 脸
    // 刘海
    ctx.fillStyle='#8b5a2b';ctx.beginPath();ctx.arc(0,-14,9,3.14,6.28);ctx.fill();ctx.fillRect(-9,-14,18,4);
    // 大眼
    ctx.fillStyle='#3a2a2a';ctx.beginPath();ctx.ellipse(-4,-4,2.5,3.5,0,0,6.28);ctx.ellipse(4,-4,2.5,3.5,0,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3.2,-5,1,0,6.28);ctx.arc(4.8,-5,1,0,6.28);ctx.fill();
    // 腮红
    ctx.fillStyle='rgba(255,120,160,0.6)';ctx.beginPath();ctx.arc(-6,0,2,0,6.28);ctx.arc(6,0,2,0,6.28);ctx.fill();
    // 嘴
    ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(0,2,2,0,3.14);ctx.fill();
  }
  else if(form>=3){ // 真实梗图皮肤 (form 3=听泉图,4=雨姐图,5=坤图,6=奶龙图)
    var sk=IMG_SKINS[form-3];var im=sk&&IMG_CACHE[sk.key];
    if(im&&im.complete&&im.width){
      ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=14;
      // cover 模式：裁中间最大方形铺满战机区，不留黑不留空
      var iw=im.width,ih=im.height,s=Math.min(iw,ih),sx=(iw-s)/2,sy=(ih-s)/2;
      ctx.beginPath();ctx.rect(-34,-46,68,92);ctx.clip();
      ctx.drawImage(im,sx,sy,s,s,-34,-46,68,92);ctx.restore();
    }else{ctx.fillStyle='#888';ctx.fillRect(-22,-26,44,52);}
  }
}

// === MAIN DRAW ===
function draw(){
  ctx.save();
  drawBackground();
  // 开场倒计时（黑屏 + 金色数字 3/2/1 + 雷霆战机图标）
  if(state=='countdown'){
    ctx.fillStyle='#000';ctx.fillRect(0,0,480,720);
    ctx.textAlign='center';
    // tick=4→3, 3→2, 2→1, 1→图标
    var tick=Math.ceil(countdownTimer/60);
    if(tick>=2){
      var num=tick-1;
      ctx.shadowColor='#ff0';ctx.shadowBlur=45;
      ctx.fillStyle='#ffd700';ctx.font='bold 140px Arial';
      ctx.fillText(num,240,380);
      ctx.shadowBlur=0;ctx.fillStyle='#aa8800';ctx.font='18px Arial';
      ctx.fillText('准备战斗！',240,500);
    }else{
      // 图标阶段（约1秒）
      ctx.shadowColor='#ff0';ctx.shadowBlur=55;
      ctx.fillStyle='#ffd700';ctx.font='bold 54px Arial';
      ctx.fillText('\u26A1 雷霆战机 \u26A1',240,340);
      ctx.shadowBlur=0;
      ctx.fillStyle='#aaa';ctx.font='20px Arial';
      ctx.fillText(getLv().name,240,430);
    }
    ctx.shadowBlur=0;
    ctx.restore();return;
  }
  if(state=='menu'){drawMenu();ctx.restore();return;}
  if(state=='levelSelect'){drawLevelSelect();ctx.restore();return;}
  if(state=='help'){drawHelp();ctx.restore();return;}
  if(state=='stats'){drawStats();ctx.restore();return;}
  if(state=='talent'){drawTalent();ctx.restore();return;}
  if(state=='settings'){drawSettings();ctx.restore();return;}
  if(state=='diy'){drawDIY();ctx.restore();return;}
  if(state=='warband'){if(wbPage=='meta')drawMetaUp();else if(wbPage=='ach')drawAch();else if(wbPage=='codex')drawCodex();else if(wbPage=='rank')drawRank();else if(wbPage=='plot')drawPlotReview();else drawWarband();ctx.restore();return;}
  // Gameplay（敌弹，赛博朋克多样样式）
  for(var i=0;i<bls.length;i++){var b=bls[i];if(!b.pl)continue;if(b.x<-30||b.x>510||b.y<-30||b.y>750)continue;
    if(b.laser){
      var ex=b.x+(b.vx||0)*b.len/8, ey=b.y+(b.vy||0)*b.len/8;
      ctx.save();ctx.globalAlpha=0.95;ctx.lineCap='round';
      ctx.strokeStyle=b.cl||'#0ff';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(ex,ey);ctx.stroke();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(ex,ey);ctx.stroke();
      ctx.restore();continue;
    }
    var ang=Math.atan2(b.vy||-1,b.vx||0);
    var spr=getBulletSprite(b.cl||'#0ff');var scX=b.h/24,scY=b.w/7;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);
    ctx.drawImage(spr,-spr.width*scX/2,-spr.height*scY/2,spr.width*scX,spr.height*scY);
    ctx.restore();
  }
  var _heavy=ens.length>6||bls.length>60;
  for(var i=0;i<ens.length;i++){var e=ens[i];ctx.save();ctx.translate(e.x,e.y);if(e.x<-40||e.x>520||e.y<-60||e.y>780){ctx.restore();continue;}
    if(e.type=='boss'){
      var bc=e.color||'#f0f',bc2=e.cl2||'#faf',bc3='#ff0';
      var sc=e.isBig?1:0.62;ctx.scale(sc,sc);
      ctx.shadowColor=bc;ctx.shadowBlur=30;ctx.fillStyle=bc;
      if((e.skin||0)==0){ // 菱形战机
        ctx.beginPath();ctx.moveTo(0,38);ctx.lineTo(-42,-24);ctx.lineTo(-21,-12);ctx.lineTo(0,-38);ctx.lineTo(21,-12);ctx.lineTo(42,-24);ctx.closePath();ctx.fill();
      }else if((e.skin||0)==1){ // 双翼堡垒
        ctx.beginPath();ctx.moveTo(0,40);ctx.lineTo(-50,-10);ctx.lineTo(-30,-30);ctx.lineTo(0,-20);ctx.lineTo(30,-30);ctx.lineTo(50,-10);ctx.closePath();ctx.fill();
      }else{ // 圆碟母舰
        ctx.beginPath();ctx.ellipse(0,0,46,30,0,0,6.28);ctx.fill();
        ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(-16,-12);ctx.lineTo(16,-12);ctx.closePath();ctx.fill();
      }
      ctx.shadowBlur=0;ctx.fillStyle=bc2;
      ctx.beginPath();ctx.moveTo(0,22);ctx.lineTo(-21,-15);ctx.lineTo(0,-22);ctx.lineTo(21,-15);ctx.closePath();ctx.fill();
      ctx.fillStyle=bc3;ctx.shadowColor=bc3;ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(-12,-4,4,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(12,-4,4,0,6.28);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle='#111';ctx.fillRect(-40,-44,80,8);var r=e.hp/e.maxHp;ctx.fillStyle=r>0.3?'#f00':'#ff0';ctx.fillRect(-39,-43,78*r,6);if(r<0.1){ctx.fillStyle='#fff';ctx.fillRect(-39,-43,78*r,6);}
      // Boss 护盾光圈
      if(e.shieldHP&&e.shieldHP>0){
        var sa=0.3+0.2*Math.sin(frameCount*0.1);
        ctx.shadowColor='#ffd27f';ctx.shadowBlur=30;ctx.strokeStyle='rgba(255,200,110,'+sa+')';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(0,0,e.w/2+12,0,6.28);ctx.stroke();
        ctx.strokeStyle='rgba(255,190,90,'+(sa*0.4)+')';ctx.lineWidth=6;
        ctx.beginPath();ctx.arc(0,0,e.w/2+16,0,6.28);ctx.stroke();ctx.shadowBlur=0;
      }
    }else if(e.type=='s'){
      var sc=[['#f44','#f88'],['#4cf','#9ff'],['#3c3','#7c7'],['#fc4','#fd9'],['#c4f','#e9f'],['#fa4','#fc9']][e.skin%6];
      ctx.fillStyle=sc[0];
      ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(-14,-8);ctx.lineTo(-7,-3);ctx.lineTo(0,-12);ctx.lineTo(7,-3);ctx.lineTo(14,-8);ctx.closePath();ctx.fill();
      ctx.fillStyle=sc[1];
      ctx.beginPath();ctx.moveTo(0,7);ctx.lineTo(-7,-5);ctx.lineTo(0,-7);ctx.lineTo(7,-5);ctx.closePath();ctx.fill();
    }else if(e.type=='m'){
      var mc=[['#f80','#fc0'],['#29f','#7cf'],['#2c2','#7e7'],['#e3e','#f9f'],['#f5a','#fcd'],['#0cf','#8ff']][e.skin%6];
      ctx.fillStyle=mc[0];
      ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(-18,-10);ctx.lineTo(-9,-5);ctx.lineTo(0,-16);ctx.lineTo(9,-5);ctx.lineTo(18,-10);ctx.closePath();ctx.fill();
      ctx.fillStyle=mc[1];
      ctx.beginPath();ctx.moveTo(0,9);ctx.lineTo(-9,-7);ctx.lineTo(0,-9);ctx.lineTo(9,-7);ctx.closePath();ctx.fill();
    }else{
      var lc=[['#f0f','#f6f','#faf'],['#f55','#f99','#fcc'],['#0ff','#8ff','#cff'],['#5d5','#9e9','#cfc'],['#fb4','#fd9','#ffc'],['#a6f','#cbf','#eef']][e.skin%6];
      ctx.fillStyle=lc[0];
      ctx.beginPath();ctx.moveTo(0,22);ctx.lineTo(-26,-14);ctx.lineTo(-13,-7);ctx.lineTo(0,-22);ctx.lineTo(13,-7);ctx.lineTo(26,-14);ctx.closePath();ctx.fill();
      ctx.fillStyle=lc[1];
      ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(-13,-9);ctx.lineTo(0,-12);ctx.lineTo(13,-9);ctx.closePath();ctx.fill();
      ctx.fillStyle=lc[2];ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(-5,-5);ctx.lineTo(0,-7);ctx.lineTo(5,-5);ctx.closePath();ctx.fill();
    }
    if(e.t>0){ctx.fillStyle='rgba(255,255,255,'+(e.t/10)+')';ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);}
    // 燃烧视觉效果（明火焰：大火舌×浓烟×火星×爆燃）
    if(e.burnTimer&&e.burnTimer>0){
      var intensity=Math.min(1,e.burnTimer/20);
      var ft=frameCount;
      // ① 机身全覆盖亮色（鲜红→橙渐变）
      ctx.fillStyle='rgba(255,30,0,'+(0.7+0.2*Math.sin(ft*0.12+e.x))+')';ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);
      ctx.fillStyle='rgba(255,150,0,'+(0.35+0.15*Math.sin(ft*0.1+e.x+1))+')';ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h*0.5);
      // ② 大型火舌（从机身顶部往上窜，更大更亮）
      var flameN=(_heavy?2:4)+Math.floor(e.w/5);
      for(var fl=0;fl<flameN;fl++){
        var phase=ft*0.08+fl*1.3;
        var flx=-e.w/2+e.w*(fl+0.5)/flameN+Math.sin(phase)*3;
        var fly=-e.h/2-Math.abs(Math.sin(ft*0.06+fl*2.1))*16*intensity-4;
        var fw=5+Math.sin(ft*0.1+fl*1.7)*2.5;
        var fh=8+Math.abs(Math.sin(ft*0.07+fl*2.3))*14*intensity;
        // 外焰（鲜红）
        ctx.fillStyle='rgba(255,40,0,'+(0.85+0.12*Math.sin(ft*0.09+fl))+')';
        ctx.beginPath();ctx.moveTo(flx-fw/1.5,fly+fh);ctx.lineTo(flx,fly);ctx.lineTo(flx+fw/1.5,fly+fh);ctx.closePath();ctx.fill();
        // 中焰（亮橙）
        ctx.fillStyle='rgba(255,140,0,'+(0.75+0.15*Math.sin(ft*0.11+fl*1.2))+')';
        ctx.beginPath();ctx.moveTo(flx-fw/2.5,fly+fh*0.7);ctx.lineTo(flx,fly+fh*0.15);ctx.lineTo(flx+fw/2.5,fly+fh*0.7);ctx.closePath();ctx.fill();
        // 内焰（鲜黄）
        ctx.fillStyle='rgba(255,220,20,'+(0.6+0.2*Math.sin(ft*0.13+fl*0.8))+')';
        ctx.beginPath();ctx.moveTo(flx-fw/5,fly+fh*0.45);ctx.lineTo(flx,fly+fh*0.05);ctx.lineTo(flx+fw/5,fly+fh*0.45);ctx.closePath();ctx.fill();
      }
      // ③ 浓烟粒子（从机身两侧和底部升起）
      if(!_heavy)for(var sm=0;sm<4;sm++){
        var smx=-e.w/2+e.w*Math.random()+Math.sin(ft*0.05+sm*3)*3;
        var smy=e.h/2-Math.random()*e.h*0.5;
        var sms=2+Math.random()*4;
        ctx.fillStyle='rgba(80,40,20,'+(0.3+0.15*Math.sin(ft*0.08+sm*2.1))+')';
        ctx.beginPath();ctx.arc(smx,smy,sms,0,6.28);ctx.fill();
        ctx.fillStyle='rgba(255,60,0,'+(0.4+0.2*Math.sin(ft*0.1+sm*1.5))+')';
        ctx.beginPath();ctx.arc(smx-1+Math.random()*2,smy-2,sms*0.5,0,6.28);ctx.fill();
      }
      // ④ 底部火星（持续溅射，更亮更大）
      if(!_heavy)for(var sp=0;sp<4;sp++){
        var spx=-e.w/2+e.w*Math.sin(ft*0.15+sp*2.3)*0.45+e.w/2;
        var spy=e.h/2-1-Math.random()*3;
        ctx.fillStyle=['rgba(255,200,50,0.9)','rgba(255,100,0,0.8)','rgba(255,50,0,0.7)'][sp%3];
        ctx.beginPath();ctx.arc(spx,spy,1.5+Math.random()*2,0,6.28);ctx.fill();
      }
      // ⑤ 两侧喷焰（左右各一个大火舌）
      for(var side=-1;side<=1;side+=2){
        if(Math.sin(ft*0.06+side*4)>0){
          var sy=-e.h/3+Math.random()*e.h*0.6;
          var sw=4+Math.sin(ft*0.1+side*2)*2;
          ctx.fillStyle='rgba(255,60,0,0.6)';
          ctx.beginPath();ctx.moveTo(side*e.w/2, sy-sw);ctx.lineTo(side*(e.w/2+6*intensity), sy);ctx.lineTo(side*e.w/2, sy+sw);ctx.closePath();ctx.fill();
          ctx.fillStyle='rgba(255,200,30,0.4)';
          ctx.beginPath();ctx.moveTo(side*e.w/2, sy-sw/2);ctx.lineTo(side*(e.w/2+4*intensity), sy);ctx.lineTo(side*e.w/2, sy+sw/2);ctx.closePath();ctx.fill();
        }
      }
    }
    if(e.type!='boss'&&e.hp<e.maxHp){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(-e.w/2,-e.h/2-6,e.w,4);ctx.fillStyle='#0f0';ctx.fillRect(-e.w/2,-e.h/2-6,e.w*(e.hp/e.maxHp),4);}
    ctx.restore();
  }
  // Boss 头顶常驻名字（绝对坐标，不受缩放影响）
  for(var i=0;i<ens.length;i++){var e=ens[i];if(e.type!='boss')continue;
    var ty=e.y-(e.isBig?70:48);
    ctx.textAlign='center';ctx.font='bold '+(e.isBig?18:16)+'px Arial';
    ctx.fillStyle=e.color||'#fff';ctx.shadowColor=e.color||'#f0f';ctx.shadowBlur=12;
    ctx.fillText('\u2620 '+(e.name||'BOSS'),e.x,ty);
    ctx.shadowBlur=0;
  }
  for(var i=0;i<bls.length;i++){var b=bls[i];if(b.pl)continue;if(b.x<-30||b.x>510||b.y<-30||b.y>750)continue;
    var col=b.cl||'#ff0';var r=b.w;
    var ang=Math.atan2(b.vy,b.vx);
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang+Math.PI/2);
    ctx.fillStyle=col;ctx.strokeStyle='#fff';ctx.lineWidth=1.2;
    if(b.homing){ // 追踪导弹：带尾焰的尖头弹
      if(b.turret){ // 炮台弧线追踪导弹：放大青色机身 + 发光光晕 + 拖尾 + 尾焰，确保清晰可见
        var R=r*1.7; // 放大绘制
        // 拖尾：沿历史轨迹点绘制渐隐的青色尾迹
        if(b.trail&&b.trail.length>=4){
          ctx.lineCap='round';ctx.lineJoin='round';
          var n=b.trail.length/2;
          for(var ti=1;ti<n;ti++){
            var a=ti/n; // 越靠尾部越淡
            ctx.strokeStyle='rgba(0,229,255,'+(a*0.7)+')';
            ctx.lineWidth=R*0.5*a+1;
            ctx.beginPath();
            ctx.moveTo(b.trail[(ti-1)*2],b.trail[(ti-1)*2+1]);
            ctx.lineTo(b.trail[ti*2],b.trail[ti*2+1]);
            ctx.stroke();
          }
        }
        // 机身
        ctx.fillStyle='#00e5ff';ctx.strokeStyle='#cffaff';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(0,-R*1.5);ctx.lineTo(R*0.9,R);ctx.lineTo(0,R*0.5);ctx.lineTo(-R*0.9,R);ctx.closePath();ctx.fill();ctx.stroke();
        // 尾焰（更长更亮）
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.moveTo(0,R*0.7);ctx.lineTo(R*0.45,R*2.0);ctx.lineTo(-R*0.45,R*2.0);ctx.closePath();ctx.fill();
        ctx.fillStyle='#bff7ff';ctx.beginPath();ctx.arc(0,-R*1.1,R*0.45,0,6.28);ctx.fill();
      }else{
        ctx.beginPath();ctx.moveTo(0,-r*1.4);ctx.lineTo(r*0.8,r);ctx.lineTo(0,r*0.4);ctx.lineTo(-r*0.8,r);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle='#ff0';ctx.beginPath();ctx.moveTo(0,r*0.6);ctx.lineTo(r*0.35,r*1.6);ctx.lineTo(-r*0.35,r*1.6);ctx.closePath();ctx.fill();
      }
    }else if(b.shape==1){ // 菱形
      ctx.beginPath();ctx.moveTo(0,-r*1.3);ctx.lineTo(r*0.9,0);ctx.lineTo(0,r*1.3);ctx.lineTo(-r*0.9,0);ctx.closePath();ctx.fill();ctx.stroke();
    }else if(b.shape==2){ // 三角箭头
      ctx.beginPath();ctx.moveTo(0,-r*1.4);ctx.lineTo(r*0.95,r);ctx.lineTo(-r*0.95,r);ctx.closePath();ctx.fill();ctx.stroke();
    }else if(b.shape==5){ // 方块（子弹感）
      ctx.fillRect(-r*0.8,-r*0.8,r*1.6,r*1.6);ctx.strokeRect(-r*0.8,-r*0.8,r*1.6,r*1.6);
    }else if(b.shape==0){ // 激光条（竖直胶囊）
      ctx.fillStyle=col;ctx.fillRect(-r*0.45,-r*1.5,r*0.9,r*3);ctx.fillStyle='#fff';ctx.fillRect(-r*0.18,-r*1.5,r*0.36,r*3);
    }else if(b.shape==4){ // 等离子环
      ctx.lineWidth=2.5;ctx.strokeStyle=col;ctx.beginPath();ctx.arc(0,0,r*1.1,0,6.28);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r*0.4,0,6.28);ctx.fill();
    }else{ // 默认：小三角（不再用圆点）
      ctx.beginPath();ctx.moveTo(0,-r*1.4);ctx.lineTo(r*0.95,r);ctx.lineTo(-r*0.95,r);ctx.closePath();ctx.fill();ctx.stroke();
    }
    ctx.restore();
  }
  for(var i=0;i<pws.length;i++){var p=pws[i];ctx.save();var bob=Math.sin(p.t*0.1)*4;ctx.translate(p.x,p.y+bob);
    for(var j=0;j<pwTypes.length;j++)if(pwTypes[j].id==p.type){var pt2=pwTypes[j];ctx.shadowColor=pt2.color;ctx.shadowBlur=25;
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,0,13,0,6.28);ctx.fill();
      ctx.fillStyle=pt2.color;ctx.font='bold 17px Arial';ctx.textAlign='center';ctx.fillText(pt2.disp,0,5);
      ctx.shadowBlur=0;ctx.strokeStyle=pt2.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,13,0,6.28);ctx.stroke();break;
    }ctx.restore();
  }
  for(var i=0;i<drs.length;i++){var d=drs[i];ctx.save();ctx.translate(d.x,d.y);
    if(!d.opened){
      var b2=Math.sin(d.t*0.08)*3;ctx.translate(0,b2);
      // 降落伞：伞盖高悬 + 长吊绳 + 下方货箱（伞与箱之间留明显空隙）
      var top=-54, cw=22, ch=13;
      ctx.shadowColor='#fa0';ctx.shadowBlur=12;
      // 伞盖（半圆）
      ctx.fillStyle='rgba(255,120,40,0.85)';ctx.strokeStyle='#ffd27f';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-cw,top+ch);ctx.quadraticCurveTo(0,top-ch, cw,top+ch);ctx.closePath();ctx.fill();ctx.stroke();
      // 伞盖条纹
      ctx.strokeStyle='rgba(255,230,150,0.7)';ctx.lineWidth=1;

  var sc=STORY[lv-1];if(!sc){hideOverlay();return;}
  var lines=[sc.s].concat(sc.d||[]);var total=lines.length;var step=0;
  showOverlay('<div class="st-card"><div class="st-head"><span class="st-ava">'+sc.a+'</span><span class="st-who">'+sc.n+'</span><span class="st-m">'+sc.m+'</span></div><div class="st-t">'+sc.t+'</div><div class="st-txt" id="stTxt"></div><div class="st-ch" id="stCh"></div><div class="st-foot"><button class="st-btn st-next" id="stNext" onclick="window.__stNext()">继续 ▶</button></div></div>');
  var txtEl=document.getElementById('stTxt');var ci=0,full='';
  function typeChar(){if(ci<full.length){txtEl.textContent+=full[ci++];setTimeout(typeChar,16+Math.random()*20);}else{showNext();}}
  function showNext(){var nx=document.getElementById('stNext');if(step<total-1){if(nx)nx.style.display='inline-block';}else{renderChoices();}}
  function nxHide(){var nx=document.getElementById('stNext');if(nx)nx.style.display='none';}
  function type(){full=lines[step]||'';ci=0;if(txtEl)txtEl.textContent='';typeChar();}
  function renderChoices(){nxHide();if(txtEl)txtEl.classList.add('done');var chEl=document.getElementById('stCh');if(!chEl)return;chEl.innerHTML='';
    (sc.c||[]).forEach(function(ch){var b=document.createElement('button');b.className='st-btn st-chb';b.textContent=ch.t;
      b.onclick=function(){if(ch.rep)gstat.rep=(gst('rep')||0)+ch.rep;saveWbBase();applyStoryBuff(ch.fx);hideOverlay();play('menuClick');};
      chEl.appendChild(b);});}
  window.__stNext=function(){if(step<total-1){step++;type();}else{renderChoices();}};
  type();
}
function applyStoryBuff(fx){if(!fx)return;if(fx=='atk'){wPower+=2;wbMsg='火力强化 +2!';wbMsgT=90;play('powerup');}else if(fx=='shield'){wShield+=1;wbMsg='护盾强化 +1!';wbMsgT=90;play('shield');}else if(fx=='heal'){hp=Math.min(mhp,hp+15);wbMsg='紧急维修 +15!';wbMsgT=90;play('levelComplete');}else if(fx=='score'){scoreMultTimer=600;wbMsg='得分狂潮!';wbMsgT=90;play('powerup');}}
function showEnding(){var rep=gst('rep')||0;var ti,bo;
  if(rep>=18){ti='★ 黎明守望者';bo='熵的潮水退去，星港的灯重新亮起。艾拉把一枚星徽别在你胸前：「你守住的不只是世界，是它继续做梦的权利。」凯恩的火、织的光、莉拉的笑，都成了新晨里的第一缕风。';}
  else if(rep<=-6){ti='☾ 寂静回响';bo='你赢了，却听不见欢呼。那些被你放弃的声音，在裂隙深处低语成余响——有些门一旦关上，便再难开启；有些名字，从此只剩风声。';}
  else{ti='✦ 裂隙之间';bo='战争结束，世界在伤痕里喘息。你没有成为传说，却成了许多人活下去的理由。这或许，已经是最好的结局。';}
  showOverlay('<div class="st-card"><div class="st-t" style="color:#ffd700">'+ti+'</div><div class="st-txt done" style="white-space:pre-wrap">'+bo+'</div><div class="st-foot"><button class="st-btn st-next" onclick="window.__wbClose()">回到主菜单 ✦</button></div></div>');
}
window.__wbLootClose=function(){hideOverlay();if(gSession.cleared&&currentLevel>=TOTAL_LEVELS)showEnding();};
function onLevelClear(){gSession.cleared=true;var gain=Math.round((50+currentLevel*8)*(1+0.1*ml('warlord')));CREDIT+=gain;gstat.totalkill=(gst('totalkill')||0)+gSession.kills;gstat.clear=(gst('clear')||0)+1;gstat.maxcombo=Math.max(gst('maxcombo')||0,gSession.maxCombo);updateDaily();checkAch();pendingLoot=true;saveWbBase();wbMsg='通关! +'+gain+' 学分';wbMsgT=160;showLoot();}
function onBossRushRound(){var gain=Math.round((30+bossRushRound*5)*(1+0.1*ml('warlord')));CREDIT+=gain;if(dailyTasks&&dailyTasks.date===todayStr()){for(var i=0;i<dailyTasks.list.length;i++){var t=dailyTasks.list[i];if(t.done)continue;if(t.type=='bossrush'){t.prog=Math.max(t.prog,bossRushRound);if(t.prog>=t.target){t.done=true;CREDIT+=Math.round(t.reward*(1+0.2*ml('scholar')));}}}}checkAch();saveWbBase();}
function onGameOver(){var gain=Math.round((10+gSession.kills*2+score*0.02)*(1+0.1*ml('warlord')));CREDIT+=gain;gstat.totalkill=(gst('totalkill')||0)+gSession.kills;gstat.maxcombo=Math.max(gst('maxcombo')||0,gSession.maxCombo);gstat.score=Math.max(gst('score')||0,score);updateDaily();checkAch();addRank(score,isBossRush?'Boss挑战':'闯关');pendingLoot=true;saveWbBase();wbMsg='阵亡! +'+gain+' 学分';wbMsgT=160;showLoot();}
function updateDaily(){if(!dailyTasks||dailyTasks.date!==todayStr())return;for(var i=0;i<dailyTasks.list.length;i++){var t=dailyTasks.list[i];if(t.done)continue;if(t.type=='kill')t.prog=Math.max(t.prog,gSession.kills);else if(t.type=='combo')t.prog=Math.max(t.prog,gSession.maxCombo);else if(t.type=='clear')t.prog=1;else if(t.type=='score')t.prog=Math.max(t.prog,score);else if(t.type=='score2')t.prog=Math.max(t.prog,score);else if(t.type=='nohit'){if(gSession.nohit)t.prog=1;}else if(t.type=='air')t.prog=Math.max(t.prog,gSession.airdrop);else if(t.type=='bossrush')t.prog=Math.max(t.prog,bossRushRound);if(t.prog>=t.target){t.done=true;CREDIT+=Math.round(t.reward*(1+0.2*ml('scholar')));}}saveWbBase();}
var wbOv=document.getElementById('wbOv');
function showOverlay(html){if(wbOv){wbOv.innerHTML=html;wbOv.style.display='flex';}}
function hideOverlay(){if(wbOv){wbOv.style.display='none';wbOv.innerHTML='';}}
window.__wbClose=function(){hideOverlay();};
function showPlot(p){showOverlay('<div class="wb-card"><div class="wb-pt">'+p.t+'</div><div class="wb-pd">'+p.d+'</div><button class="wb-btn" onclick="window.__wbClose()">继续 ▶</button></div>');}
function showLoot(){if(!pendingLoot)return;var res=rollLoot();pendingLoot=false;var rn='',rc='#aaa';for(var i=0;i<LOOT_RARITY.length;i++)if(LOOT_RARITY[i].key==res.rarity){rn=LOOT_RARITY[i].name;rc=LOOT_RARITY[i].color;}var html='<div class="wb-card"><div class="wb-lt" style="color:'+rc+'">'+rn+' 补给箱</div><div class="wb-pd">获得 <b style="color:#ffd700">'+res.credit+' 学分</b>'+(res.tp>0?' + '+res.tp+' 天赋点':'')+'</div><button class="wb-btn" onclick="window.__wbLootClose()">收下 ✦</button></div>';showOverlay(html);}
var wbBtns=[];
function wbBtn(x,y,w,h,label,accent,act){wbBtns.push({x:x,y:y,w:w,h:h,act:act});var hov=myRaw>y-h/2&&myRaw<y+h/2&&mxRaw>x-w/2&&mxRaw<x+w/2;ctx.fillStyle=hov?'rgba(40,70,120,0.95)':'rgba(20,32,60,0.92)';ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.shadowColor=accent;ctx.shadowBlur=hov?16:7;drawRoundedRect(x-w/2,y-h/2,w,h,10);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=hov?'#fff':'#dfeaff';ctx.font='bold '+UF(16)+'px Arial';ctx.textAlign='center';ctx.fillText(label,x,y+6);}
function wbClick(mx,my){ensureAudio();play('menuClick');for(var i=0;i<wbBtns.length;i++){var b=wbBtns[i];if(my>b.y-b.h/2&&my<b.y+b.h/2&&mx>b.x-b.w/2&&mx<b.x+b.w/2){var a=b.act;if(a=='back'){wbPage='home';return;}if(a=='meta'){wbPage='meta';return;}if(a=='ach'){wbPage='ach';return;}if(a=='codex'){wbPage='codex';return;}if(a=='rank'){wbPage='rank';return;}if(a=='plot'){wbPage='plot';return;}if(a=='help'){transitionTo('help');return;}if(a=='home'){transitionTo('menu');return;}if(a=='sign'){checkDailyReset();return;}if(a&&a.indexOf('meta_')===0){buyMeta(a.substr(5));return;}}}}
function drawWarband(){wbBtns=[];ctx.textAlign='center';ctx.fillStyle='#04071a';ctx.fillRect(0,0,480,720);var ng=ctx.createRadialGradient(240,140,10,240,140,360);ng.addColorStop(0,'rgba(70,130,255,0.14)');ng.addColorStop(1,'rgba(70,130,255,0)');ctx.fillStyle=ng;ctx.fillRect(0,0,480,720);ctx.fillStyle='#ffd98a';ctx.font='bold '+UF(30)+'px Arial';ctx.fillText('⚡ 战令中心',240,58);ctx.fillStyle='#9ab';ctx.font=UF(15)+'px Arial';ctx.fillText('学分 '+CREDIT+'    连续签到 '+signStreak+' 天',240,86);var sd=(signDate===todayStr());wbBtn(240,128,210,42,sd?'每日签到 ✓ 已签到':'每日签到 +学分','#ffae3a','sign');ctx.fillStyle='#3fd0ff';ctx.font='bold '+UF(17)+'px Arial';ctx.fillText('— 今日任务 —',240,182);if(dailyTasks&&dailyTasks.list){for(var i=0;i<dailyTasks.list.length;i++){var t=dailyTasks.list[i];var yy=206+i*34;ctx.textAlign='left';ctx.fillStyle=t.done?'#5f8':'#cde';ctx.font=UF(13)+'px Arial';ctx.fillText((t.done?'✓ ':'· ')+t.desc+'  '+Math.min(t.prog,t.target)+'/'+t.target,44,yy);ctx.textAlign='center';}}wbBtn(120,400,150,46,'军校·升级','#c77bff','meta');wbBtn(360,400,150,46,'成就','#ffd700','ach');wbBtn(120,458,150,46,'图鉴','#3fd0ff','codex');wbBtn(360,458,150,46,'排行榜','#ff5a5a','rank');wbBtn(120,516,150,46,'剧情回顾','#9f9','plot');wbBtn(360,516,150,46,'属性介绍','#3fd0ff','help');wbBtn(240,636,200,46,'返回主菜单','#3fd0ff','home');if(wbMsgT>0){wbMsgT--;ctx.fillStyle='#ffd98a';ctx.font='bold '+UF(16)+'px Arial';ctx.fillText(wbMsg,240,694);}}
function drawMetaUp(){wbBtns=[];ctx.textAlign='center';ctx.fillStyle='#04071a';ctx.fillRect(0,0,480,720);ctx.fillStyle='#c77bff';ctx.font='bold '+UF(26)+'px Arial';ctx.fillText('🎓 军校·永久升级',240,46);ctx.fillStyle='#9ab';ctx.font=UF(14)+'px Arial';ctx.fillText('学分 '+CREDIT+'（永久生效·死亡不丢）',240,72);for(var i=0;i<META_UPGRADES.length;i++){var m=META_UPGRADES[i];var lv=ml(m.id);var yy=104+i*64;ctx.fillStyle='rgba(30,30,60,0.85)';drawRoundedRect(30,yy-24,300,52,8);ctx.fill();ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold '+UF(15)+'px Arial';ctx.fillText(m.name+' Lv.'+lv+'/'+m.max,42,yy-4);ctx.fillStyle='#cde';ctx.font=UF(11)+'px Arial';ctx.fillText(m.desc,42,yy+14);var cost=m.cost*(lv+1);var can=lv<m.max&&CREDIT>=cost;wbBtn(390,yy,76,42,lv>=m.max?'满级':('升 '+cost),can?'#ffae3a':'#556','meta_'+m.id);}wbBtn(240,684,200,42,'返回','#3fd0ff','back');if(wbMsgT>0){wbMsgT--;ctx.fillStyle='#ffd98a';ctx.font='bold '+UF(15)+'px Arial';ctx.fillText(wbMsg,240,672);}}
function drawAch(){wbBtns=[];ctx.textAlign='center';ctx.fillStyle='#04071a';ctx.fillRect(0,0,480,720);ctx.fillStyle='#ffd700';ctx.font='bold '+UF(26)+'px Arial';ctx.fillText('🏆 成就',240,46);var done=0;for(var k=0;k<ACHIEVEMENTS.length;k++)if(achDone[ACHIEVEMENTS[k].id])done++;ctx.fillStyle='#9ab';ctx.font=UF(14)+'px Arial';ctx.fillText('已达成 '+done+' / '+ACHIEVEMENTS.length,240,72);for(var i=0;i<ACHIEVEMENTS.length;i++){var a=ACHIEVEMENTS[i];var yy=100+i*52;var ok=!!achDone[a.id];ctx.fillStyle=ok?'rgba(40,70,40,0.85)':'rgba(40,30,50,0.85)';drawRoundedRect(30,yy-22,420,46,8);ctx.fill();ctx.textAlign='left';ctx.fillStyle=ok?'#6f6':'#fff';ctx.font='bold '+UF(14)+'px Arial';ctx.fillText((ok?'✓ ':'· ')+a.name,42,yy-4);ctx.fillStyle='#cde';ctx.font=UF(11)+'px Arial';ctx.fillText(a.desc+'  ('+Math.min(gst(a.stat),a.target)+'/'+a.target+')',42,yy+14);}wbBtn(240,691,200,38,'返回','#3fd0ff','back');}
function drawCodex(){wbBtns=[];ctx.textAlign='center';ctx.fillStyle='#04071a';ctx.fillRect(0,0,480,720);ctx.fillStyle='#3fd0ff';ctx.font='bold '+UF(24)+'px Arial';ctx.fillText('📖 图鉴',240,46);ctx.fillStyle='#9ab';ctx.font=UF(13)+'px Arial';ctx.fillText('击败大 Boss 解锁（'+countCodex()+'/'+BIGBOSSES.length+'）',240,70);for(var i=0;i<BIGBOSSES.length;i++){var b=BIGBOSSES[i];var yy=98+i*30;ctx.textAlign='left';ctx.fillStyle=codex['boss'+i]?b.color:'#556';ctx.font=UF(13)+'px Arial';ctx.fillText((codex['boss'+i]?b.name:'？？？ 未击败'),44,yy);}wbBtn(240,691,200,38,'返回','#3fd0ff','back');}
function countCodex(){var n=0;for(var i=0;i<BIGBOSSES.length;i++)if(codex['boss'+i])n++;return n;}
function drawRank(){wbBtns=[];ctx.textAlign='center';ctx.fillStyle='#04071a';ctx.fillRect(0,0,480,720);ctx.fillStyle='#ff5a5a';ctx.font='bold '+UF(24)+'px Arial';ctx.fillText('🏅 本地排行榜',240,46);if(!lb.length){ctx.fillStyle='#889';ctx.font=UF(15)+'px Arial';ctx.fillText('暂无记录，去战斗吧！',240,360);}for(var i=0;i<lb.length;i++){var r=lb[i];var yy=96+i*52;ctx.textAlign='left';ctx.fillStyle=i===0?'#ffd700':'#fff';ctx.font='bold '+UF(17)+'px Arial';ctx.fillText((i+1)+'. '+r.s,44,yy);ctx.fillStyle='#9ab';ctx.font=UF(12)+'px Arial';ctx.fillText('['+r.m+'] '+r.d,150,yy+2);}wbBtn(240,691,200,38,'返回','#3fd0ff','back');}
function drawPlotReview(){wbBtns=[];ctx.textAlign='center';ctx.fillStyle='#04071a';ctx.fillRect(0,0,480,720);ctx.fillStyle='#9f9';ctx.font='bold '+UF(22)+'px Arial';ctx.fillText('📜 剧情回顾',240,40);for(var i=0;i<STORY.length;i++){var p=STORY[i];var yy=66+i*14;ctx.textAlign='left';ctx.fillStyle=i<currentLevel?'#cde':'#556';ctx.font=UF(11)+'px Arial';ctx.fillText((i+1)+'. '+p.t,30,yy);}wbBtn(240,700,200,34,'返回','#3fd0ff','back');}
function drawComboBanner(){if(state!=='playing'&&state!=='countdown')return;if(vcCombo>=10){ctx.save();ctx.textAlign='center';var col=vcCombo>=50?'#ff3b3b':vcCombo>=30?'#ffd700':vcCombo>=20?'#3fd0ff':'#9f9';ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=14;ctx.globalAlpha=0.9;ctx.font='bold '+UF(Math.round(26+Math.min(14,vcCombo*0.3)))+'px Arial';ctx.fillText(vcCombo+' 连击!',240,150);ctx.restore();}}
